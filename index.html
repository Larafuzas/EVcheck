<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck v2.0</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            
            --score-green: #00C800;
            --score-yellow: #FFD60A;
            --score-orange: #FF9F0A;
            --score-red: #FF453A;
            --neon-green: var(--score-green);
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            
            --score-green: #34C759;
            --score-yellow: #FFCC00;
            --score-orange: #FF9500;
            --score-red: #FF3B30;
            --neon-green: var(--score-green);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        /* Tarjetas del Inicio */
        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
        .car-card-header { display: flex; justify-content: space-between; align-items: center; }
        .car-info h2 { font-size: 1.15rem; margin-bottom: 4px; color: var(--neon-green); }
        .car-info h3 { font-size: 1rem; margin-bottom: 4px; font-weight: normal; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); }
        
        .car-score { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid; min-width: 65px; text-align: center; }
        .score-80 { background-color: rgba(52, 199, 89, 0.1); color: var(--score-green); border-color: var(--score-green); }
        .score-60 { background-color: rgba(255, 204, 0, 0.1); color: var(--score-yellow); border-color: var(--score-yellow); }
        .score-45 { background-color: rgba(255, 149, 0, 0.1); color: var(--score-orange); border-color: var(--score-orange); }
        .score-0  { background-color: rgba(255, 59, 48, 0.1); color: var(--score-red); border-color: var(--score-red); }

        /* Barras de progreso */
        .progress-bar-container { width: 100%; background: var(--bg-color); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-fill { height: 100%; transition: width 0.4s ease, background-color 0.4s ease; }
        
        .cat-progress-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cat-progress-text { font-size: 0.9rem; font-weight: bold; min-width: 50px; text-align: right; }

        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; }

        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 180px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); overflow: hidden;}
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, var(--bg-color)); }
        
        .back-btn { position: absolute; top: 15px; left: 15px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 10; }
        .delete-car-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,59,48,0.1); color: var(--score-red); border: 1px solid var(--score-red); padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .duplicate-car-btn { position: absolute; top: 15px; right: 65px; background: rgba(10,132,255,0.1); color: #0A84FF; border: 1px solid #0A84FF; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        .view-image-btn { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 10px; background: rgba(0, 200, 0, 0.05); border: 1px solid var(--neon-green); border-radius: 12px; z-index: 5; box-shadow: var(--neon-glow); }
        .view-image-btn p { color: var(--neon-green); font-size: 0.8rem; font-weight: bold; margin-top: 8px; }

        /* Pestañas Horizontales Scrolleables */
        .tabs-wrapper { display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); background: var(--surface-color); scroll-behavior: smooth; }
        .tabs-wrapper::-webkit-scrollbar { display: none; } /* Ocultar scrollbar visual */
        .tab { padding: 14px 15px; font-size: 0.85rem; flex-shrink: 0; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.85rem; color: var(--neon-green); margin-bottom: 8px; font-weight: bold; }
        .data-group input, .data-group select, .data-group textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus, .data-group textarea:focus { outline: none; border-color: var(--neon-green); }
        .data-group textarea { resize: vertical; min-height: 100px; }
        
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 12px; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--neon-green); }
        
        .select-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); gap: 8px; }
        .select-item:last-child { border-bottom: none; }
        .select-item label { font-size: 0.95rem; }
        .select-item select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }

        .remove-btn { background: none; border: none; color: var(--score-red); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; margin-left: 10px; }
        
        .add-equip-row { display: flex; gap: 10px; margin-top: 20px; }
        .add-equip-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        button.action-btn.small { width: auto; padding: 10px 20px; margin-top: 0; }
        
        .version-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--surface-color); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); margin-left: 10px; }
        .section-title { color: var(--neon-green); margin: 25px 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-size: 1.05rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { position: relative; width: 100%; height: 85%; max-width: 800px; background: var(--surface-color); border-radius: 12px; overflow: hidden; border: 1px solid var(--neon-green); box-shadow: var(--neon-glow); }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: var(--neon-green); border: 1px solid var(--neon-green); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="margin-right: 10px; border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <defs>
                <filter id="neonGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#39FF14" flood-opacity="0.8"/>
                </filter>
              </defs>
              <g filter="url(#neonGlowHeader)" stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="3" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck v2.0</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" id="settings-btn" aria-label="Ajustes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="action-btn" onclick="addNewCar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Evaluación
            </button>
        </div>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; border: none; padding: 0;">Acerca de EVcheck</h3>
            <span class="version-tag" id="app-version-display"></span>
        </div>

        <div class="config-section">
            <h3>Datos y Copias de Seguridad</h3>
            <button class="action-btn secondary" onclick="exportData()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar Datos de la App
            </button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Restaurar Datos
            </button>
        </div>

        <div class="config-section">
            <h3>Pesos de las 10 Categorías (%)</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Según tu PDF la suma por defecto es 115%. El sistema de la app normaliza y recorta el total para que el máximo global siempre sea el 100% perfecto.</p>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Puntuación Base Máxima:</label>
                <span id="weight-total" style="color: var(--neon-green);">115%</span>
            </div>
        </div>

        <div class="config-section">
            <h3>Peligro</h3>
            <button class="action-btn secondary" style="color: var(--score-red); border-color: var(--score-red);" onclick="nukeData()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Borrar todos los datos de V2
            </button>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-header-container">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Inicio
            </button>
            <button class="duplicate-car-btn" onclick="duplicateCurrentCar()" aria-label="Duplicar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="delete-car-btn" onclick="deleteCurrentCar()" aria-label="Eliminar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            
            <div id="view-image-btn" class="view-image-btn" onclick="openImageModal()" style="display: none;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>Ver Foto</p>
            </div>

            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs-wrapper" id="tabs-container">
            <!-- Pestañas generadas por JS -->
        </div>

        <div id="tabs-content-container">
            <!-- Contenido generado por JS -->
        </div>
    </div>

    <!-- Modal de Imagen -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const APP_VERSION = "v2.0.0";
        
        // Estructura maestra basada en "Factores de evaluación EV.pdf"
        const CATEGORY_DEFS = {
            precio: { title: "Precio", weight: 20 },
            tasacion: { title: "Tasación", weight: 10 },
            bateria: { title: "Batería", weight: 20 },
            conectividad: { title: "Tecnología", weight: 15 },
            adas: { title: "ADAS", weight: 15 },
            extras: { title: "Extras", weight: 3 },
            exterior: { title: "Exterior", weight: 4 },
            interior: { title: "Interior", weight: 8 },
            prueba: { title: "Prueba", weight: 15 },
            garantia: { title: "Garantía", weight: 5 }
        };

        const DEFAULT_WEIGHTS = Object.keys(CATEGORY_DEFS).reduce((acc, key) => {
            acc[key] = CATEGORY_DEFS[key].weight;
            return acc;
        }, {});

        function getNewCarTemplate() {
            return {
                id: "ev-" + Date.now(),
                marca: "Marca",
                modelo: "Modelo",
                concesionario: "Concesionario",
                precioCorto: "0 €",
                img: "",
                notas: "",
                categorias: {
                    precio: {
                        items: [
                            { id: "p1", text: "Mejor precio al contado (igual a financiando)", type: "check", val: false },
                            { id: "p2", text: "Menores intereses en financiación", type: "check", val: false },
                            { id: "p3", text: "Menor comisión de apertura", type: "check", val: false }
                        ]
                    },
                    tasacion: {
                        items: [
                            { id: "t1", text: "Tasación Nissan Qashqai", type: "select", options: [
                                { label: "Sin tasar o indiferente", val: 0 },
                                { label: "Mejor tasación (+15.000 €)", val: 1 },
                                { label: "Tasación media (14k € - 15k €)", val: 0.5 },
                                { label: "Peor tasación (-14.000 €)", val: -0.5 }
                            ], val: 0 }
                        ]
                    },
                    bateria: {
                        items: [
                            { id: "b1", text: "Capacidad de la batería", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+60 kWh", val: 1 },
                                { label: "+50 kWh", val: 0.5 },
                                { label: "-50 kWh", val: -0.5 }
                            ], val: 0 },
                            { id: "b2", text: "Autonomía WLTP", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+450 km", val: 1 },
                                { label: "+400 km", val: 0.5 },
                                { label: "-400 km", val: -0.5 }
                            ], val: 0 },
                            { id: "b3", text: "Carga rápida (Pico CC)", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+100 kW", val: 1 },
                                { label: "-100 kW", val: -0.5 }
                            ], val: 0 }
                        ]
                    },
                    conectividad: {
                        items: [
                            { id: "c1", text: "CarPlay / Android Auto", type: "check", val: false },
                            { id: "c2", text: "Cámara 360º o cámara trasera", type: "check", val: false },
                            { id: "c3", text: "App apertura y climatización remota", type: "check", val: false },
                            { id: "c4", text: "Mapa con búsqueda de puntos de carga", type: "check", val: false },
                            { id: "c5", text: "Sistema fluido y moderno", type: "check", val: false },
                            { id: "c6", text: "Asistencia de aparcamiento", type: "check", val: false },
                            { id: "c7", text: "Perfiles de usuario", type: "check", val: false }
                        ]
                    },
                    adas: {
                        items: [
                            { id: "a1", text: "Mantenimiento activo de carril", type: "check", val: false },
                            { id: "a2", text: "Aviso de ángulo muerto", type: "check", val: false },
                            { id: "a3", text: "Alerta anticolisión (frenada ayuda)", type: "check", val: false },
                            { id: "a4", text: "Alerta antiatropello (frenada activa)", type: "check", val: false },
                            { id: "a5", text: "Asistencia en atascos", type: "check", val: false },
                            { id: "a6", text: "Conducción autónoma Nivel 2", type: "check", val: false },

                    },
                    prueba: {

                            { id: "pr1", text: "Aceleración", type: "check", val: false },

                            { id: "pr3", text: "Aislamiento acústico", type: "check", val: false },
                            { id: "pr4", text: "Dirección", type: "check", val: false },
                            { id: "pr5", text: "Modos de conducción", type: "check", val: false },
                            { id: "pr6", text: "One Pedal real", type: "check", val: false },
                            { id: "pr7", text: "Modos de regeneración (levas)", type: "check", val: false }
                        ]
                    },
                    garantia: {
                        items: [
                            { id: "ga1", text: "Garantía general", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+7 años", val: 1 },
                                { label: "+5 años", val: 0.5 },
                                { label: "-5 años", val: -0.5 }
                            ], val: 0 },
                            { id: "ga2", text: "Garantía de la batería", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+8 años", val: 1 },
                                { label: "-8 años", val: -0.5 }
                            ], val: 0 },
                            { id: "ga3", text: "Mantenimiento", type: "select", options: [
                                { label: "Pendiente", val: 0 },
                                { label: "+ de 2 años / 30.000km", val: 1 },
                                { label: "- de 2 años / 30.000km", val: -0.5 }
                            ], val: 0 }
                        ]
                    }
                }
            };
        }

        // LIMPIEZA DE DATOS V1: Como el formato es radicalmente diferente, partimos de cero con nueva key de localStorage.
        let appData = JSON.parse(localStorage.getItem('evcheck_v2_data'));
        if (!appData || !Array.isArray(appData)) {
            appData = [];
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
        }

        let appWeights = JSON.parse(localStorage.getItem('evcheck_v2_weights'));
        if (!appWeights || Object.keys(appWeights).length === 0) {
            appWeights = DEFAULT_WEIGHTS; 
        }

        let currentCarId = null;
        let currentModalUrl = '';

        let currentThemeSetting = localStorage.getItem('evcheck_theme_mode') || 'auto';
        const mediaQueryLight = window.matchMedia('(prefers-color-scheme: light)');

        function applyTheme(setting) {
            let isLight = false;
            if (setting === 'auto') isLight = mediaQueryLight.matches;
            else isLight = (setting === 'light');
            document.body.classList.toggle('light-mode', isLight);
        }

        function changeTheme() {
            currentThemeSetting = document.getElementById('theme-select').value;
            localStorage.setItem('evcheck_theme_mode', currentThemeSetting);
            applyTheme(currentThemeSetting);
        }

        mediaQueryLight.addEventListener('change', () => {
            if (currentThemeSetting === 'auto') applyTheme('auto');
        });

        window.onload = () => {
            document.getElementById('app-version-display').innerText = APP_VERSION;
            document.getElementById('theme-select').value = currentThemeSetting;
            applyTheme(currentThemeSetting);
            renderDashboard();
            renderWeightsConfig();
        };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            document.getElementById('settings-btn').style.display = viewId === 'detail-view' ? 'none' : 'flex';
            document.getElementById('header-title').innerText = viewId === 'settings-view' ? 'Configuración V2' : 'EVcheck v2.0';
            
            if (viewId === 'dashboard-view') renderDashboard();
        }

        function toggleSettings() {
            const currentView = document.querySelector('.view.active').id;
            showView(currentView === 'settings-view' ? 'dashboard-view' : 'settings-view');
        }

        function addNewCar() {
            const newCar = getNewCarTemplate();
            appData.push(newCar);
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            showDetail(newCar.id);
        }

        function duplicateCurrentCar() {
            const carToCopy = appData.find(c => c.id === currentCarId);
            if (!carToCopy) return;
            let newCar = JSON.parse(JSON.stringify(carToCopy));
            newCar.id = "ev-" + Date.now();
            newCar.concesionario = newCar.concesionario + " (Copia)";
            appData.push(newCar);
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            showDetail(newCar.id);
        }

        function deleteCurrentCar() {
            if (confirm("¿Estás seguro de que deseas eliminar este vehículo por completo?")) {
                appData = appData.filter(c => c.id !== currentCarId);
                localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
                showView('dashboard-view');
            }
        }

        function nukeData() {
            if (confirm("¿Peligro! ¿Estás seguro de que quieres borrar TODOS los coches guardados y empezar de cero?")) {
                appData = [];
                localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
                showView('dashboard-view');
            }
        }

        function exportData() {
            const backup = { data: appData, weights: appWeights, version: APP_VERSION };
            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `EVcheck_V2_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.data && parsed.version && parsed.version.includes("v2")) {
                        localStorage.setItem('evcheck_v2_data', JSON.stringify(parsed.data));
                        if(parsed.weights) localStorage.setItem('evcheck_v2_weights', JSON.stringify(parsed.weights));
                        alert('Copia V2 restaurada correctamente.');
                        location.reload();
                    } else {
                        alert('El archivo no tiene el formato V2 correcto. (Los archivos V1 ya no son compatibles).');
                    }
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function checkOTA() {
            const status = document.getElementById('ota-status');
            status.innerText = "Buscando actualizaciones...";
            setTimeout(() => {
                status.innerText = `EVcheck está en la última versión (${APP_VERSION}).`;
                setTimeout(() => status.innerText = "", 3000);
            }, 1500);
        }

        function renderWeightsConfig() {
            const container = document.getElementById('weights-container');
            container.innerHTML = Object.keys(CATEGORY_DEFS).map(key => `
                <div class="weight-row">
                    <label>${CATEGORY_DEFS[key].title}</label>
                    <input type="number" min="0" max="100" value="${appWeights[key]}" oninput="updateWeight('${key}', this.value)">
                </div>
            `).join('');
            updateTotalWeight();
        }

        function updateWeight(key, value) {
            appWeights[key] = Number(value);
            localStorage.setItem('evcheck_v2_weights', JSON.stringify(appWeights));
            updateTotalWeight();
        }

        function updateTotalWeight() {
            const total = Object.values(appWeights).reduce((a, b) => a + b, 0);
            const totalEl = document.getElementById('weight-total');
            totalEl.innerText = `${total}%`;
            totalEl.style.color = 'var(--neon-green)';
        }

        function getScoreColorClass(score) {
            if (score >= 80) return 'score-80';
            if (score >= 60) return 'score-60';
            if (score >= 45) return 'score-45';
            return 'score-0';
        }

        // --- EL NUEVO MOTOR MATEMÁTICO PERFECTO ---
        function calculateScore(car) {
            let totalContribution = 0;
            
            for (let catId in CATEGORY_DEFS) {
                if (!car.categorias[catId]) continue;
                let cat = car.categorias[catId];
                let weight = Number(appWeights[catId] || CATEGORY_DEFS[catId].weight);
                let numItems = cat.items.length;
                
                if (numItems === 0) continue;

                // Sumamos el valor de cada elemento. (Checks aportan 1 o 0. Selects aportan su val que puede ser negativo)
                let catRawScore = cat.items.reduce((acc, item) => {
                    let v = (item.type === 'check') ? (item.val ? 1 : 0) : Number(item.val || 0);
                    return acc + v;
                }, 0);

                // El porcentaje de esta categoría sobre su propio máximo posible
                let catPercent = (catRawScore / numItems);
                
                // La contribución real a la nota global del coche
                totalContribution += (catPercent * weight);
            }

            // Limitamos que la nota final nunca sea menor a 0 ni mayor a 100
            return Math.min(100, Math.max(0, Math.round(totalContribution)));
        }

        function renderDashboard() {
            const list = document.getElementById('car-list');
            appData.sort((a, b) => calculateScore(b) - calculateScore(a));
            list.innerHTML = appData.map(car => {
                let currentScore = calculateScore(car);
                
                return `
                <div class="car-card" onclick="showDetail('${car.id}')">
                    <div class="car-card-header">
                        <div class="car-info">
                            <h2>${car.marca} ${car.modelo}</h2>
                            <h3>🏢 ${car.concesionario}</h3>
                            <p style="margin-top: 5px;">Precio/Info: <strong style="color:var(--text-color); margin-left:5px;">${car.precioCorto}</strong></p>
                        </div>
                        <div class="car-score ${getScoreColorClass(currentScore)}">${currentScore}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function formatGoogleDriveUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                const match = url.match(/(?:file\/d\/|id=|open\?id=)([a-zA-Z0-9_-]{25,})/);
                if (match && match[1]) {
                    return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }
            return url;
        }

        function openImageModal() {
            if (!currentModalUrl) return;
            document.getElementById('modal-iframe').src = currentModalUrl;
            document.getElementById('image-modal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.remove('active');
            document.getElementById('modal-iframe').src = '';
        }

        function updateHeaderImageBtn(url) {
            currentModalUrl = formatGoogleDriveUrl(url);
            const btn = document.getElementById('view-image-btn');
            if (currentModalUrl) {
                btn.style.display = 'flex';
            } else {
                btn.style.display = 'none';
            }
        }

        function showDetail(id) {
            currentCarId = id;
            const car = appData.find(c => c.id === id);
            
            document.getElementById('detail-title').innerText = `${car.marca} ${car.modelo}`;
            updateHeaderImageBtn(car.img);
            
            buildDynamicTabsAndContent(car);
            
            showView('detail-view');
            switchTab('tab-btn-anotaciones', 'tab-content-anotaciones');
        }

        function buildDynamicTabsAndContent(car) {
            const tabsWrapper = document.getElementById('tabs-container');
            const contentContainer = document.getElementById('tabs-content-container');
            
            let tabsHtml = `<div class="tab" id="tab-btn-anotaciones" onclick="switchTab('tab-btn-anotaciones', 'tab-content-anotaciones')">Anotaciones</div>`;
            let contentHtml = `
            <div id="tab-content-anotaciones" class="tab-content">
                <div class="data-group"><label>Marca</label><input type="text" value="${car.marca}" oninput="updateCarBaseData('marca', this.value)"></div>
                <div class="data-group"><label>Modelo</label><input type="text" value="${car.modelo}" oninput="updateCarBaseData('modelo', this.value)"></div>
                <div class="data-group"><label>Concesionario</label><input type="text" value="${car.concesionario}" oninput="updateCarBaseData('concesionario', this.value)"></div>
                <div class="data-group"><label>Precio de referencia / Resumen Corto</label><input type="text" value="${car.precioCorto}" oninput="updateCarBaseData('precioCorto', this.value)" placeholder="Ej. 34.000 € (Contado)"></div>
                <div class="data-group"><label>URL Imagen (Drive/Web)</label><input type="url" value="${car.img}" oninput="updateCarBaseData('img', this.value)"></div>
                <div class="data-group"><label>Anotaciones de la prueba / Detalles de la oferta</label><textarea oninput="updateCarBaseData('notas', this.value)">${car.notas}</textarea></div>
            </div>`;

            // Construir las 10 pestañas dinámicas
            for (let catId in CATEGORY_DEFS) {
                if (!car.categorias[catId]) continue; // Por si hay datos corruptos
                
                tabsHtml += `<div class="tab" id="tab-btn-${catId}" onclick="switchTab('tab-btn-${catId}', 'tab-content-${catId}')">${CATEGORY_DEFS[catId].title}</div>`;
                
                let cat = car.categorias[catId];
                let maxVal = cat.items.length;
                let currentVal = cat.items.reduce((acc, item) => acc + (item.type === 'check' ? (item.val ? 1 : 0) : Number(item.val)), 0);
                let percentage = maxVal > 0 ? (currentVal / maxVal) * 100 : 0;
                let visPercent = Math.max(0, Math.min(100, percentage));

                contentHtml += `
                <div id="tab-content-${catId}" class="tab-content">
                    <div class="cat-progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: ${visPercent}%; background-color: ${visPercent >= 80 ? 'var(--score-green)' : visPercent >= 50 ? 'var(--score-yellow)' : 'var(--score-red)'};"></div>
                        </div>
                        <div class="cat-progress-text" style="color: ${visPercent >= 80 ? 'var(--score-green)' : visPercent >= 50 ? 'var(--score-yellow)' : 'var(--score-red)'}">${Math.round(percentage)}%</div>
                    </div>
                    <div id="items-list-${catId}">
                        ${cat.items.map((item, idx) => {
                            if (item.type === 'check') {
                                return `
                                <div class="check-item">
                                    <label>
                                        <input type="checkbox" ${item.val ? 'checked' : ''} onchange="updateItemVal('${catId}',${idx}, this.checked, 'check')">
                                        ${item.text}
                                    </label>
                                    <button class="remove-btn" onclick="removeItem('${catId}',${idx})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                                </div>`;
                            } else if (item.type === 'select') {
                                return `
                                <div class="select-item">
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <label style="color:var(--neon-green); font-weight:bold;">${item.text}</label>
                                        <button class="remove-btn" onclick="removeItem('${catId}',${idx})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                                    </div>
                                    <select onchange="updateItemVal('${catId}',${idx}, this.value, 'select')">
                                        ${item.options.map(opt => `<option value="${opt.val}" ${Number(item.val) === Number(opt.val) ? 'selected' : ''}>${opt.label}</option>`).join('')}
                                    </select>
                                </div>`;
                            }
                        }).join('')}
                    </div>
                    <div class="add-equip-row">
                        <input type="text" id="new-item-input-${catId}" placeholder="Añadir nuevo elemento a ${CATEGORY_DEFS[catId].title}">
                        <button class="action-btn small" onclick="addNewItem('${catId}')">Añadir</button>
                    </div>
                </div>`;
            }

            tabsWrapper.innerHTML = tabsHtml;
            contentContainer.innerHTML = contentHtml;
        }

        function switchTab(btnId, contentId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const btn = document.getElementById(btnId);
            const content = document.getElementById(contentId);
            
            if(btn) btn.classList.add('active');
            if(content) content.classList.add('active');
        }

        function updateCarBaseData(key, val) {
            const car = appData.find(c => c.id === currentCarId);
            car[key] = val;
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            
            if (key === 'marca' || key === 'modelo') {
                document.getElementById('detail-title').innerText = `${car.marca} ${car.modelo}`;
            }
            if (key === 'img') {
                updateHeaderImageBtn(val);
            }
        }

        function updateItemVal(catId, itemIdx, val, type) {
            const car = appData.find(c => c.id === currentCarId);
            if (type === 'check') {
                car.categorias[catId].items[itemIdx].val = val;
            } else if (type === 'select') {
                car.categorias[catId].items[itemIdx].val = Number(val);
            }
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            
            // Re-render specifically just this tab to update the progress bar inside it cleanly
            buildDynamicTabsAndContent(car);
            switchTab(`tab-btn-${catId}`, `tab-content-${catId}`);
        }

        function addNewItem(catId) {
            const input = document.getElementById(`new-item-input-${catId}`);
            const val = input.value.trim();
            if (!val) return;

            const car = appData.find(c => c.id === currentCarId);
            car.categorias[catId].items.push({ id: Date.now(), text: val, type: "check", val: true });
            
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            buildDynamicTabsAndContent(car);
            switchTab(`tab-btn-${catId}`, `tab-content-${catId}`);
        }

        function removeItem(catId, itemIdx) {
            const car = appData.find(c => c.id === currentCarId);
            car.categorias[catId].items.splice(itemIdx, 1);
            
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            buildDynamicTabsAndContent(car);
            switchTab(`tab-btn-${catId}`, `tab-content-${catId}`);
        }
    </script>
</body>
