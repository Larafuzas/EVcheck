<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck V3.1</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            --score-green: #34C759;
            --score-yellow: #FFCC00;
            --score-orange: #FF9500;
            --score-red: #FF3B30;
            --neon-green: #39FF14;
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            --neon-green: #00C800;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; gap: 10px; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        /* Tarjetas Dashboard */
        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
        .car-card-header { display: flex; justify-content: space-between; align-items: center; }
        .car-info h2 { font-size: 1.15rem; margin-bottom: 4px; color: var(--neon-green); }
        .car-info h3 { font-size: 1rem; margin-bottom: 4px; font-weight: normal; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); }
        
        .car-score { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid; min-width: 65px; text-align: center; }
        .score-80 { background-color: rgba(52, 199, 89, 0.1); color: var(--score-green); border-color: var(--score-green); }
        .score-60 { background-color: rgba(255, 204, 0, 0.1); color: var(--score-yellow); border-color: var(--score-yellow); }
        .score-45 { background-color: rgba(255, 149, 0, 0.1); color: var(--score-orange); border-color: var(--score-orange); }
        .score-0  { background-color: rgba(255, 59, 48, 0.1); color: var(--score-red); border-color: var(--score-red); }

        /* UI Elementos */
        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; }

        /* Cabecera Coche */
        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 180px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); overflow: hidden; background-size: cover; background-position: center;}
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, var(--bg-color)); }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 10; backdrop-filter: blur(5px);}
        .delete-car-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,59,48,0.8); color: #fff; border: none; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .duplicate-car-btn { position: absolute; top: 15px; right: 65px; background: rgba(10,132,255,0.8); color: #fff; border: none; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        .view-image-btn { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 10px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-green); border-radius: 12px; z-index: 5; backdrop-filter: blur(4px);}
        .view-image-btn p { color: var(--neon-green); font-size: 0.8rem; font-weight: bold; margin-top: 8px; }

        /* Pestañas */
        .tabs-wrapper { display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); background: var(--surface-color); scroll-behavior: smooth; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab { padding: 14px 15px; font-size: 0.85rem; flex-shrink: 0; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        /* Formularios y Grupos */
        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.85rem; color: var(--neon-green); margin-bottom: 8px; font-weight: bold; }
        .data-group input, .data-group select, .data-group textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus, .data-group textarea:focus { outline: none; border-color: var(--neon-green); }
        .data-group textarea { resize: vertical; min-height: 80px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .grid-2 .data-group { padding: 10px; margin: 0; }
        .grid-full { grid-column: 1 / -1; }

        /* Listas de Evaluación */
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 12px; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--neon-green); }
        
        .select-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); gap: 8px; }
        .select-item:last-child { border-bottom: none; }
        .select-item select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }

        .progress-bar-container { width: 100%; background: var(--bg-color); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 20px;}
        .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease, background-color 0.3s ease; }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        
        /* Modal de Imagen */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { position: relative; width: 100%; height: 85%; max-width: 800px; background: var(--surface-color); border-radius: 12px; overflow: hidden; border: 1px solid var(--neon-green); }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: var(--neon-green); border: 1px solid var(--neon-green); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <g stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="4" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck V3.1</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" aria-label="Ajustes">
            <!-- Icono SVG clásico compatible -->
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="action-btn" onclick="addNewCar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Oferta
            </button>
            <button class="action-btn secondary" onclick="document.getElementById('import-car-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Importar JSON
            </button>
            <input type="file" id="import-car-file" style="display: none;" accept=".json, .txt" onchange="importSingleCar(event)">
        </div>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section">
            <h3>Apariencia y Sistema</h3>
            <div class="weight-row" style="border:none; padding:0;">
                <label>Tema</label>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <option value="auto">Automático</option>
                    <option value="dark">Noche</option>
                    <option value="light">Día</option>
                </select>
            </div>
            <button class="action-btn secondary" style="margin-top: 15px;" onclick="checkOTA()">
                Buscar Actualizaciones OTA
            </button>
            <p id="ota-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;"></p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;">Versión Instalada: <span id="app-version-display"></span></p>
        </div>

        <div class="config-section">
            <h3>Copias de Seguridad (Global)</h3>
            <button class="action-btn secondary" onclick="exportData()">Exportar Garaje Completo</button>
            <input type="file" id="import-file" style="display: none;" accept=".json, .txt" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">Restaurar Garaje</button>
        </div>

        <div class="config-section">
            <h3>Pesos de las 10 Categorías (%)</h3>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Total Actual:</label>
                <span id="weight-total" style="color: var(--neon-green);">100%</span>
            </div>
        </div>

        <div class="config-section">
            <h3 style="color: var(--score-red);">Peligro</h3>
            <button class="action-btn secondary" style="color: var(--score-red); border-color: var(--score-red);" onclick="nukeData()">Borrar todos los datos</button>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-header-container">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Inicio
            </button>
            <button class="duplicate-car-btn" onclick="duplicateCurrentCar()" aria-label="Duplicar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="delete-car-btn" onclick="deleteCurrentCar()" aria-label="Eliminar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            
            <div id="view-image-btn" class="view-image-btn" onclick="openImageModal()" style="display: none;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>Ver Foto</p>
            </div>
            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs-wrapper" id="tabs-container"></div>
        <div id="tabs-content-container"></div>
    </div>

    <!-- Modal Imagen -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS Y CONFIGURACIÓN SEGURA ---
        var APP_VERSION = "v3.1.0";

        var CATEGORY_DEFS = {
            precio: { title: "Precio", weight: 20 },
            tasacion: { title: "Tasación", weight: 10 },
            bateria: { title: "Batería", weight: 20 },
            conectividad: { title: "Tecnología", weight: 15 },
            adas: { title: "ADAS", weight: 15 },
            extras: { title: "Extras", weight: 3 },
            exterior: { title: "Exterior", weight: 4 },
            interior: { title: "Interior", weight: 8 },
            prueba: { title: "Prueba", weight: 15 },
            garantia: { title: "Garantía", weight: 5 }
        };

        var DEFAULT_WEIGHTS = {};
        for (var key in CATEGORY_DEFS) { DEFAULT_WEIGHTS[key] = CATEGORY_DEFS[key].weight; }

        function getNewCarTemplate() {
            return {
                id: "ev-" + Date.now() + Math.floor(Math.random() * 1000),
                marca: "Marca",

                categorias: {

                    ]},
                    tasacion: { items: [{ id: "t1", text: "Tasación del Vehículo Usado (€)", type: "number_score", val: 0, minRef: 12000, maxRef: 16000 }]},
                    bateria: { items: [{ id: "b1", text: "Capacidad de la batería", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+60 kWh", val: 1 }, { label: "+50 kWh", val: 0.5 }, { label: "-50 kWh", val: -0.5 }], val: 0 }, { id: "b2", text: "Autonomía WLTP", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+450 km", val: 1 }, { label: "+400 km", val: 0.5 }, { label: "-400 km", val: -0.5 }], val: 0 }, { id: "b3", text: "Carga rápida (Pico CC)", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+100 kW", val: 1 }, { label: "-100 kW", val: -0.5 }], val: 0 }] },
                    conectividad: { items: [{ id: "c1", text: "CarPlay / Android Auto", type: "check", val: false }, { id: "c2", text: "Cámara 360º o trasera", type: "check", val: false }, { id: "c3", text: "App remota", type: "check", val: false }, { id: "c4", text: "Mapa puntos de carga", type: "check", val: false }, { id: "c5", text: "Sistema fluido", type: "check", val: false }, { id: "c6", text: "Asist. aparcamiento", type: "check", val: false }, { id: "c7", text: "Perfiles usuario", type: "check", val: false }] },
                    adas: { items: [{ id: "a1", text: "Mantenimiento carril", type: "check", val: false }, { id: "a2", text: "Ángulo muerto", type: "check", val: false }, { id: "a3", text: "Alerta colisión", type: "check", val: false }, { id: "a4", text: "Alerta atropello", type: "check", val: false }, { id: "a5", text: "Asist. atascos", type: "check", val: false }, { id: "a6", text: "Autonomía Nivel 2", type: "check", val: false }, { id: "a7", text: "Tráfico cruzado", type: "check", val: false }] },
                    extras: { items: [{ id: "ex1", text: "Barras techo", type: "check", val: false }, { id: "ex2", text: "Techo solar", type: "check", val: false }, { id: "ex3", text: "Faros Matrix LED", type: "check", val: false }, { id: "ex4", text: "Luces cortesía", type: "check", val: false }, { id: "ex5", text: "Head Up Display", type: "check", val: false }] },

        function sanitizeCar(car) {
            if(!car.finanzas) car.finanzas = { precioContado: 0, precioFinanciado: 0, entrada: 0, plazo: 0, cuotaMensual: 0, cuotaFinal: 0, tae: 0, comision: 0, otros: 0 };

            } else {
                for (var cat in template.categorias) {
                    if (!car.categorias[cat] || !car.categorias[cat].items) {
                        car.categorias[cat] = template.categorias[cat];
                    }
                }
            }
            return car;
        }

        function initApp() {
            try {
                var storedData = localStorage.getItem('evcheck_v3_data');
                if (storedData) {
                    var parsedData = JSON.parse(storedData);
                    if (Array.isArray(parsedData)) {
                        appData = parsedData;
                    }
                }
            } catch (e) { appData = []; }
            
            for(var i=0; i<appData.length; i++){
                appData[i] = sanitizeCar(appData[i]);
            }
            
            try {
                var storedWeights = localStorage.getItem('evcheck_v3_weights');
                if (storedWeights) appWeights = JSON.parse(storedWeights);
            } catch (e) {}

            var currentThemeSetting = localStorage.getItem('evcheck_theme_mode') || 'auto';
            var selectEl = document.getElementById('theme-select');
            if (selectEl) selectEl.value = currentThemeSetting;
            applyTheme(currentThemeSetting);
            
            var verEl = document.getElementById('app-version-display');
            if(verEl) verEl.innerText = APP_VERSION;

            evaluateMarket();
            renderDashboard();
        }

        // MATEMÁTICAS Y EVALUACIÓN CENTRAL A PRUEBA DE FALLOS
        function evaluateMarket() {
            var minContado = Infinity;
            var minIntereses = Infinity;
            var minComision = Infinity;

            for(var i=0; i<appData.length; i++) {
                var f = appData[i].finanzas;
                if (!f) continue;
                
                var pC = Number(f.precioContado || 0);
                if (pC > 0 && pC < minContado) minContado = pC;

                var cA = Number(f.comision || 0);
                if (cA > 0 && cA < minComision) minComision = cA;

                var isFin = (Number(f.entrada||0) > 0 || Number(f.plazo||0) > 0);
                if (isFin) {
                    var coste = Number(f.entrada||0) + (Number(f.cuotaMensual||0)*Number(f.plazo||0)) + Number(f.cuotaFinal||0) + Number(f.comision||0) + Number(f.otros||0);
                    var pF = Number(f.precioFinanciado||0);
                    if (coste > 0 && pF > 0) {
                        var int = coste - pF;
                        if (int >= 0 && int < minIntereses) minIntereses = int;
                    }
                }
            }

            for(var j=0; j<appData.length; j++) {
                var c = appData[j];
                if (!c.finanzas || !c.categorias || !c.categorias.precio) continue;
                var f2 = c.finanzas;
                var items = c.categorias.precio.items;
                if(!items || items.length < 3) continue;

                var pC2 = Number(f2.precioContado || 0);
                items[0].val = (pC2 > 0 && pC2 === minContado);

                var isFin2 = (Number(f2.entrada||0) > 0 || Number(f2.plazo||0) > 0);
                var coste2 = isFin2 ? (Number(f2.entrada||0) + (Number(f2.cuotaMensual||0)*Number(f2.plazo||0)) + Number(f2.cuotaFinal||0) + Number(f2.comision||0) + Number(f2.otros||0)) : 0;
                var int2 = (isFin2 && coste2 > 0 && Number(f2.precioFinanciado||0) > 0) ? (coste2 - Number(f2.precioFinanciado)) : null;
                items[1].val = (int2 !== null && int2 === minIntereses);

                var cA2 = Number(f2.comision || 0);
                items[2].val = (Number(f2.plazo||0) > 0 && cA2 <= minComision);
            }
            saveData();
        }

        function calculateScore(car) {
            if (!car || !car.categorias) return 0;
            var total = 0;
            
            for (var catId in CATEGORY_DEFS) {
                var cat = car.categorias[catId];
                if (!cat || !cat.items) continue;
                
                var weight = Number(appWeights[catId]);
                if (isNaN(weight)) weight = CATEGORY_DEFS[catId].weight;
                
                var numItems = cat.items.length;
                if (numItems === 0) continue;

                var rawScore = 0;
                for (var i=0; i<numItems; i++) {
                    var item = cat.items[i];
                    if (item.type === 'check' || item.type === 'check_auto') {
                        // En JS, si es string "true" tmb evaluará a 1, si es boolean tmb.
                        rawScore += (item.val === true || item.val === "true" || item.val === 1) ? 1 : 0;
                    } else if (item.type === 'select') {
                        rawScore += Number(item.val || 0);
                    } else if (item.type === 'number_score') {
                        var valNum = Number(item.val || 0);
                        var minR = Number(item.minRef || 0);
                        var maxR = Number(item.maxRef || 1);
                        var diff = maxR - minR;
                        if (diff === 0) diff = 1;
                        var ratio = (valNum - minR) / diff;
                        if (ratio > 1) ratio = 1;
                        if (ratio < 0) ratio = 0;
                        rawScore += ratio;
                    }
                }
                
                if (catId === 'precio' && car.finanzas && car.categorias.tasacion && car.categorias.tasacion.items[0]) {
                    var f = car.finanzas;
                    var tVal = Number(car.categorias.tasacion.items[0].val || 0);
                    var isFin = (Number(f.entrada||0)>0 || Number(f.plazo||0)>0);
                    var costeTotal = isFin ? (Number(f.entrada||0) + (Number(f.cuotaMensual||0)*Number(f.plazo||0)) + Number(f.cuotaFinal||0) + Number(f.comision||0) + Number(f.otros||0)) : Number(f.precioContado||0);
                    
                    var costeBolsillo = costeTotal - tVal;
                    // Formula base: 15k de bolsillo = 100% en matemática pura de precio.
                    var priceMathScore = 1 - ((costeBolsillo - 15000) / 25000); 
                    if (priceMathScore > 1) priceMathScore = 1;
                    if (priceMathScore < 0) priceMathScore = 0;
                    
                    var checkScore = rawScore / numItems; 
                    var finalCatPercent = (priceMathScore * 0.7) + (checkScore * 0.3);
                    total += (finalCatPercent * weight);
                } else {
                    total += ((rawScore / numItems) * weight);
                }
            }
            
            if (isNaN(total)) return 0;
            var finalScore = Math.round(total);
            if (finalScore > 100) finalScore = 100;
            if (finalScore < 0) finalScore = 0;
            return finalScore;
        }

        // RENDERIZADOS
        function renderDashboard() {
            var list = document.getElementById('car-list');
            if (!list) return;
            
            var sortedData = appData.slice();
            sortedData.sort(function(a, b) { return calculateScore(b) - calculateScore(a); });
            var html = '';
            
            for(var i=0; i<sortedData.length; i++) {
                var c = sortedData[i];
                var score = calculateScore(c);
                var colorClass = score >= 80 ? 'score-80' : (score >= 50 ? 'score-60' : 'score-0');
                
                html += '<div class="car-card" onclick="showDetail(\'' + c.id + '\')">';
                html += '<div class="car-card-header">';
                html += '<div class="car-info">';
                html += '<h2>' + (c.marca || 'Marca') + ' ' + (c.modelo || 'Modelo') + '</h2>';
                html += '<h3>🏢 ' + (c.concesionario || 'Sin Concesionario') + '</h3>';
                html += '<p style="margin-top: 5px;">Precio/Info: <strong style="color:var(--text-color); margin-left:5px;">' + (c.precioCorto || '') + '</strong></p>';
                html += '</div>';
                html += '<div class="car-score ' + colorClass + '">' + score + '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

                    } else if (item.type === 'check_auto') {
                        var op = item.val ? '1' : '0.4';
                        contentHtml += '<div class="check-item" style="background:rgba(0,200,0,0.05); padding:10px; border-radius:6px;"><label id="lbl-auto-' + item.id + '" style="color:var(--neon-green); opacity:' + op + '"><input type="checkbox" id="chk-auto-' + item.id + '" ' + itemValStr + ' disabled> ' + item.text + '</label></div>';
                    } else if (item.type === 'select') {
                        contentHtml += '<div class="select-item"><label style="color:var(--neon-green); font-weight:bold;">' + item.text + '</label>';
                        contentHtml += '<select onchange="handleItemInput(\'' + catId + '\', ' + j + ', this.value, \'select\')">';
                        for(var o=0; o<item.options.length; o++) {
                            var opt = item.options[o];
                            var isSel = (Number(item.val)===Number(opt.val)) ? 'selected' : '';
                            contentHtml += '<option value="' + opt.val + '" ' + isSel + '>' + opt.label + '</option>';
                        }
                        contentHtml += '</select></div>';
                    } else if (item.type === 'number_score') {
                        contentHtml += '<div class="data-group" style="padding:10px;"><label>' + item.text + '</label>';
                        contentHtml += '<input type="number" value="' + (item.val||0) + '" oninput="handleItemInput(\'' + catId + '\', ' + j + ', this.value, \'number_score\')"></div>';
                    }
                }
                contentHtml += '</div>';
            }
            
            tabsWrapper.innerHTML = tabsHtml;
            contentContainer.innerHTML = contentHtml;
            
            for (var cId in CATEGORY_DEFS) updateProgressBarDOM(car, cId);
        }

        function switchTab(btnId, contentId) {
            var tabs = document.querySelectorAll('.tab');
            var contents = document.querySelectorAll('.tab-content');
            for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
            for(var j=0; j<contents.length; j++) contents[j].classList.remove('active');
            
            var btn = document.getElementById(btnId);
            var content = document.getElementById(contentId);
            if (btn) btn.classList.add('active');
            if (content) content.classList.add('active');
        }

        function handleBaseInput(key, val) {
            var car = getCarById(currentCarId);
            if (!car) return;
            car[key] = val;
            saveData();
            
            if (key === 'marca' || key === 'modelo') {
                var title = document.getElementById('detail-title');
                if (title) title.innerText = (car.marca||'') + ' ' + (car.modelo||'');
            }
            if (key === 'img') {
                var head = document.getElementById('detail-header-container');
                if (head) {
                    var formatUrl = formatGoogleDriveUrl(val);
                    if(formatUrl) head.style.backgroundImage = "url('" + formatUrl + "')";
                    else head.style.backgroundImage = "none";
                }
            }
        }

        function handleFinInput(key, val, type) {
            var car = getCarById(currentCarId);
            if (!car) return;
            
            if (type === 'check') car.finanzas[key] = val;
            else car.finanzas[key] = val === '' ? 0 : Number(val);
            
            saveData();
            updateFinanceDOM(); 
            evaluateMarket(); 
        }

        function handleItemInput(catId, itemIdx, val, type) {
            var car = getCarById(currentCarId);
            if (!car) return;
            
            var item = car.categorias[catId].items[itemIdx];
            if (type === 'check') item.val = val;
            else item.val = val === '' ? 0 : Number(val);
            
            saveData();
            updateProgressBarDOM(car, catId);
            if (catId === 'tasacion') updateFinanceDOM(); 
            evaluateMarket();
        }

        function updateFinanceDOM() {
            var car = getCarById(currentCarId);
            if (!car || !car.finanzas) return;
            var f = car.finanzas;
            
            var isFin = (Number(f.entrada||0)>0 || Number(f.plazo||0)>0);
            var costeTot = isFin ? (Number(f.entrada||0) + (Number(f.cuotaMensual||0)*Number(f.plazo||0)) + Number(f.cuotaFinal||0) + Number(f.comision||0) + Number(f.otros||0)) : Number(f.precioContado||0);
            var ints = isFin ? Math.max(0, costeTot - Number(f.precioFinanciado||0)) : 0;
            var vsContado = isFin ? Math.max(0, costeTot - Number(f.precioContado||0)) : 0;
            
            var tasacion = 0;
            if (car.categorias.tasacion && car.categorias.tasacion.items[0]) {
                tasacion = Number(car.categorias.tasacion.items[0].val || 0);
            }
            var neto = costeTot - tasacion;

            var elLbl = document.getElementById('lbl-tipo-pago');
            var elTot = document.getElementById('res-coste-total');
            var elInt = document.getElementById('res-intereses');
            var elVs = document.getElementById('res-vs-contado');
            var elNeto = document.getElementById('res-neto');

            if (elLbl) elLbl.innerText = isFin ? 'Coste Total (A plazos):' : 'Coste Total (Al Contado):';
            if (elTot) elTot.innerText = costeTot.toLocaleString('es-ES') + ' €';
            if (elInt) elInt.innerText = '+' + ints.toLocaleString('es-ES') + ' €';
            if (elVs) {
                elVs.innerText = '+' + vsContado.toLocaleString('es-ES') + ' €';
                elVs.style.color = vsContado > 0 ? 'var(--score-red)' : 'var(--text-muted)';
            }
            if (elNeto) {
                elNeto.innerText = neto.toLocaleString('es-ES') + ' €';
                elNeto.style.color = neto < 0 ? 'var(--neon-green)' : 'var(--text-color)';
            }

            if(car.categorias.precio) {
                var items = car.categorias.precio.items;
                for(var i=0; i<items.length; i++) {
                    var item = items[i];
                    var chk = document.getElementById('chk-auto-' + item.id);
                    var lbl = document.getElementById('lbl-auto-' + item.id);
                    if(chk) chk.checked = item.val;
                    if(lbl) lbl.style.opacity = item.val ? '1' : '0.4';
                }
                updateProgressBarDOM(car, 'precio');
            }
        }

        function updateProgressBarDOM(car, catId) {
            var cat = car.categorias[catId];
            if (!cat) return;
            var maxVal = cat.items.length;
            var currentVal = 0;

            for(var i=0; i<maxVal; i++) {
                var item = cat.items[i];
                if (item.type === 'check' || item.type === 'check_auto') currentVal += (item.val === true || item.val === "true" || item.val === 1 ? 1 : 0);
                else if (item.type === 'select') currentVal += Number(item.val || 0);
                else if (item.type === 'number_score') {
                    var v = Number(item.val || 0);
                    var minR = Number(item.minRef || 0);
                    var maxR = Number(item.maxRef || 1);
                    var rat = (v - minR) / (maxR - minR);
                    currentVal += Math.max(0, Math.min(1, rat));
                }
            }

            var perc = maxVal > 0 ? (currentVal / maxVal) * 100 : 0;
            if (isNaN(perc)) perc = 0;
            var visPerc = Math.max(0, Math.min(100, perc));
            var color = visPerc >= 80 ? 'var(--score-green)' : (visPerc >= 50 ? 'var(--score-yellow)' : 'var(--score-red)');
            
            var fill = document.getElementById('prog-fill-' + catId);
            var txt = document.getElementById('prog-txt-' + catId);
            
            if (fill) { fill.style.width = visPerc + '%'; fill.style.backgroundColor = color; }
            if (txt) { txt.innerText = Math.round(perc) + '%'; txt.style.color = color; }
        }

        // LIMPIADOR DE JSON ANTI-MARKDOWN EXTREMO
        function sanitizeJSONString(rawText) {
            var text = rawText.replace(/\[span_\d+\]\((start_span|end_span)\)/g, '');
            text = text.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
            var start = text.indexOf('{');
            var startArr = text.indexOf('[');
            var first = -1;
            if (start !== -1 && startArr !== -1) first = Math.min(start, startArr);
            else if (start !== -1) first = start;
            else if (startArr !== -1) first = startArr;
            
            var end = text.lastIndexOf('}');
            var endArr = text.lastIndexOf(']');
            var last = -1;
            if (end !== -1 && endArr !== -1) last = Math.max(end, endArr);
            else if (end !== -1) last = end;
            else if (endArr !== -1) last = endArr;

            if (first !== -1 && last !== -1 && first < last) {
                return text.substring(first, last + 1);
            }
            return text.trim();
        }

        function importSingleCar(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var cleanText = sanitizeJSONString(e.target.result);
                    var parsed = JSON.parse(cleanText);
                    var carsToAdd = Array.isArray(parsed) ? parsed : [parsed];
                    var added = 0;

                    for(var i=0; i<carsToAdd.length; i++) {
                        var data = carsToAdd[i];
                        var newCar = getNewCarTemplate(); 
                        newCar.id = "ev-" + Date.now() + Math.floor(Math.random() * 1000);
                        
                        if(data.marca) newCar.marca = data.marca;
                        if(data.modelo) newCar.modelo = data.modelo;
                        if(data.concesionario) newCar.concesionario = data.concesionario;
                        if(data.precioCorto) newCar.precioCorto = data.precioCorto;
                        if(data.notas) newCar.notas = data.notas;
                        if(data.img) newCar.img = data.img;
                        
                        if(data.finanzas) {
                            for(var fKey in data.finanzas) {
                                newCar.finanzas[fKey] = data.finanzas[fKey];
                            }
                        }

                        if (data.valores) {
                            for (var catKey in data.valores) {
                                if (newCar.categorias[catKey]) {
                                    for(var v=0; v<data.valores[catKey].length; v++) {
                                        if (newCar.categorias[catKey].items[v]) {
                                            newCar.categorias[catKey].items[v].val = data.valores[catKey][v];
                                        }
                                    }
                                }
                            }
                        }
                        appData.push(newCar);
                        added++;
                    }

                    if (added > 0) {
                        saveData();
                        alert('Se han importado ' + added + ' vehículo(s) correctamente.');
                        evaluateMarket(); 
                        renderDashboard();
                    }
                } catch (err) {
                    alert('Error fatal al leer el archivo JSON. Verifica el formato proporcionado por el Gem.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function formatGoogleDriveUrl(url) {
            if (!url) return '';
            if (url.indexOf('drive.google.com') !== -1) {
                var match = url.match(/(?:file\/d\/|id=|open\?id=)([a-zA-Z0-9_-]{25,})/);
                if (match && match[1]) {
                    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1200';
                }
            }
            return url;
        }

        // Lanza la inicialización a prueba de fallos
        initApp();
    </script>
