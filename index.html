<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck V5.2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            --score-green: #34C759;
            --score-yellow: #FFCC00;
            --score-orange: #FF9500;
            --score-red: #FF3B30;
            --neon-green: #39FF14;
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            --neon-green: #00C800;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; gap: 10px; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
        .car-card-header { display: flex; justify-content: space-between; align-items: center; }
        .car-info h2 { font-size: 1.15rem; margin-bottom: 4px; color: var(--neon-green); }
        .car-info h3 { font-size: 1rem; margin-bottom: 4px; font-weight: normal; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); }
        
        .car-score { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid; min-width: 65px; text-align: center; }
        .score-80 { background-color: rgba(52, 199, 89, 0.1); color: var(--score-green); border-color: var(--score-green); }
        .score-60 { background-color: rgba(255, 204, 0, 0.1); color: var(--score-yellow); border-color: var(--score-yellow); }
        .score-45 { background-color: rgba(255, 149, 0, 0.1); color: var(--score-orange); border-color: var(--score-orange); }
        .score-0  { background-color: rgba(255, 59, 48, 0.1); color: var(--score-red); border-color: var(--score-red); }

        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; }

        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 180px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); overflow: hidden; background-size: cover; background-position: center;}
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, var(--bg-color)); }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 10; backdrop-filter: blur(5px);}
        .delete-car-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,59,48,0.8); color: #fff; border: none; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .duplicate-car-btn { position: absolute; top: 15px; right: 65px; background: rgba(10,132,255,0.8); color: #fff; border: none; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        .view-image-btn { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 10px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-green); border-radius: 12px; z-index: 5; backdrop-filter: blur(4px);}
        .view-image-btn p { color: var(--neon-green); font-size: 0.8rem; font-weight: bold; margin-top: 8px; }

        .tabs-wrapper { display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); background: var(--surface-color); scroll-behavior: smooth; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab { padding: 14px 15px; font-size: 0.85rem; flex-shrink: 0; color: var(--text-muted); cursor: pointer; border-bottom: 2px transparent solid; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.85rem; color: var(--neon-green); margin-bottom: 8px; font-weight: bold; }
        .data-group input, .data-group select, .data-group textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus, .data-group textarea:focus { outline: none; border-color: var(--neon-green); }
        .data-group textarea { resize: vertical; min-height: 80px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .grid-2 .data-group { padding: 10px; margin: 0; }
        .grid-full { grid-column: 1 / -1; }

        .segmented-control { display: flex; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .seg-btn { flex: 1; text-align: center; padding: 12px; font-size: 0.85rem; cursor: pointer; background: transparent; color: var(--text-muted); border: none; border-right: 1px solid var(--border-color); font-weight: bold; }
        .seg-btn:last-child { border-right: none; }
        .seg-btn.active { background: var(--neon-green); color: #000; }

        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 12px; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--neon-green); }
        
        .select-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); gap: 8px; }
        .select-item:last-child { border-bottom: none; }
        .select-item select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }

        .progress-bar-container { width: 100%; background: var(--bg-color); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 20px;}
        .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease, background-color 0.3s ease; }
        .cat-progress-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cat-progress-text { font-size: 0.9rem; font-weight: bold; min-width: 50px; text-align: right; }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        
        .remove-btn { background: none; border: none; color: var(--score-red); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; margin-left: 10px; }
        .add-equip-row { display: flex; gap: 10px; margin-top: 20px; }
        .add-equip-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        .add-equip-row button { margin-top: 0; width: auto; padding: 10px 20px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { position: relative; width: 100%; height: 85%; max-width: 800px; background: var(--surface-color); border-radius: 12px; overflow: hidden; border: 1px solid var(--neon-green); }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: var(--neon-green); border: 1px solid var(--neon-green); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <g stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="4" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck V5.2</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" aria-label="Ajustes">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="action-btn" onclick="addNewCar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Oferta
            </button>
            <button class="action-btn secondary" onclick="document.getElementById('import-car-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Importar JSON
            </button>
            <input type="file" id="import-car-file" style="display: none;" accept=".json, .txt" onchange="importSingleCar(event)">
        </div>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section">
            <h3>Apariencia y Sistema</h3>
            <div class="weight-row" style="border:none; padding:0;">
                <label>Tema</label>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <option value="auto">Automático</option>
                    <option value="dark">Noche</option>
                    <option value="light">Día</option>
                </select>
            </div>
            <button class="action-btn secondary" style="margin-top: 15px;" onclick="checkOTA()">
                Buscar Actualizaciones OTA
            </button>
            <p id="ota-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;"></p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;">Versión Instalada: <span id="app-version-display"></span></p>
        </div>

        <div class="config-section">
            <h3>Copias de Seguridad</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Guarda una copia de toda tu base de datos y plantillas. Totalmente compatible con iOS.</p>
            <button class="action-btn secondary" onclick="exportData()">Exportar Garaje Completo</button>
            <input type="file" id="import-file" style="display: none;" accept=".json, .txt" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">Restaurar Garaje</button>
        </div>

        <div class="config-section">
            <h3>Pesos de las 10 Categorías (%)</h3>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Total Actual:</label>
                <span id="weight-total" style="color: var(--neon-green);">100%</span>
            </div>
        </div>

        <div class="config-section">
            <h3 style="color: var(--score-red);">Peligro</h3>
            <button class="action-btn secondary" style="color: var(--score-red); border-color: var(--score-red);" onclick="nukeData()">Borrar todos los datos</button>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-header-container">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Inicio
            </button>
            <button class="duplicate-car-btn" onclick="duplicateCurrentCar()" aria-label="Duplicar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="delete-car-btn" onclick="deleteCurrentCar()" aria-label="Eliminar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            
            <div id="view-image-btn" class="view-image-btn" onclick="openImageModal()" style="display: none;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>Ver Foto</p>
            </div>
            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs-wrapper" id="tabs-container"></div>
        <div id="tabs-content-container"></div>
    </div>

    <!-- Modal Imagen -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        var APP_VERSION = "V5.2.0";

        var CATEGORY_DEFS = {
            precio: { title: "Precio", weight: 20, items: [
                { id: "p_coste", text: "🏆 Mejor coste neto de operación (Auto)", type: "check_auto", val: false }, 
                { id: "p_intereses", text: "📉 Menores intereses pagados (Auto)", type: "check_auto", val: false }, 
                { id: "p_comision", text: "💸 Menores comisiones o gastos (Auto)", type: "check_auto", val: false }
            ]},
            tasacion: { title: "Tasación", weight: 10, items: [{ id: "t1", text: "Tasación del Vehículo Usado (€)", type: "number_score", val: 0, minRef: 12000, maxRef: 16000 }]},
            bateria: { title: "Batería", weight: 20, items: [{ id: "b1", text: "Capacidad de la batería", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+60 kWh", val: 1 }, { label: "+50 kWh", val: 0.5 }, { label: "-50 kWh", val: -0.5 }], val: 0 }, { id: "b2", text: "Autonomía WLTP", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+450 km", val: 1 }, { label: "+400 km", val: 0.5 }, { label: "-400 km", val: -0.5 }], val: 0 }, { id: "b3", text: "Carga rápida (Pico CC)", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+100 kW", val: 1 }, { label: "-100 kW", val: -0.5 }], val: 0 }] },
            conectividad: { title: "Tecnología", weight: 15, items: [{ id: "c1", text: "CarPlay / Android Auto", type: "check", val: false }, { id: "c2", text: "Cámara 360º o trasera", type: "check", val: false }, { id: "c3", text: "App remota", type: "check", val: false }, { id: "c4", text: "Mapa puntos de carga", type: "check", val: false }, { id: "c5", text: "Sistema fluido", type: "check", val: false }, { id: "c6", text: "Asist. aparcamiento", type: "check", val: false }, { id: "c7", text: "Perfiles usuario", type: "check", val: false }] },
            adas: { title: "ADAS", weight: 15, items: [{ id: "a1", text: "Mantenimiento carril", type: "check", val: false }, { id: "a2", text: "Ángulo muerto", type: "check", val: false }, { id: "a3", text: "Alerta colisión", type: "check", val: false }, { id: "a4", text: "Alerta atropello", type: "check", val: false }, { id: "a5", text: "Asist. atascos", type: "check", val: false }, { id: "a6", text: "Autonomía Nivel 2", type: "check", val: false }, { id: "a7", text: "Alerta de tráfico cruzado", type: "check", val: false }] },
            extras: { title: "Extras", weight: 3, items: [{ id: "ex1", text: "Barras techo", type: "check", val: false }, { id: "ex2", text: "Techo solar", type: "check", val: false }, { id: "ex3", text: "Faros Matrix LED", type: "check", val: false }, { id: "ex4", text: "Luces cortesía", type: "check", val: false }, { id: "ex5", text: "Head Up Display", type: "check", val: false }] },

        function sanitizeCar(car) {
            if(!car.finanzas || !car.finanzas.activo) {
                var old = car.finanzas || {};
                var def = old.tipoCompra || 'contado';
                car.finanzas = {
                    activo: def,
                    contado: { precioContado: old.precioContado||0, otros: old.otros||0, incluyePlanAuto: old.incluyePlanAuto||false, incluyeCae: old.incluyeCae||false, incluyeCargador: old.incluyeCargador||false, incluyeMantenimiento: old.incluyeMantenimiento||false },
                    lineal: { precioContado: old.precioContado||0, precioFinanciado: old.precioFinanciado||0, entrada: old.entrada||0, plazo: old.plazo||0, cuotaMensual: old.cuotaMensual||0, comision: old.comision||0, tae: old.tae||0, otros: old.otros||0, incluyePlanAuto: old.incluyePlanAuto||false, incluyeCae: old.incluyeCae||false, incluyeCargador: old.incluyeCargador||false, incluyeMantenimiento: old.incluyeMantenimiento||false },
                    flexible: { precioContado: old.precioContado||0, precioFinanciado: old.precioFinanciado||0, entrada: old.entrada||0, plazo: old.plazo||0, cuotaMensual: old.cuotaMensual||0, cuotaFinal: old.cuotaFinal||0, comision: old.comision||0, tae: old.tae||0, otros: old.otros||0, incluyePlanAuto: old.incluyePlanAuto||false, incluyeCae: old.incluyeCae||false, incluyeCargador: old.incluyeCargador||false, incluyeMantenimiento: old.incluyeMantenimiento||false }
                };
            }
            
            var newCats = JSON.parse(JSON.stringify(globalCategories));
            if (car.categorias) {
                for (var c in newCats) {
                    var oldCat = car.categorias[c];
                    if (!oldCat || !oldCat.items) continue;
                    var oldMap = {};
                    for (var i=0; i<oldCat.items.length; i++) {
                        oldMap[oldCat.items[i].id] = oldCat.items[i].val;
                    }
                    for (var j=0; j<newCats[c].items.length; j++) {
                        var nId = newCats[c].items[j].id;
                        if (oldMap[nId] !== undefined) newCats[c].items[j].val = oldMap[nId];
                    }
                }
            }
            car.categorias = newCats;
            return car;
        }

        // --- MATEMÁTICAS FINANCIERAS Y MERCADO ---
        function calculateFinanceTotals(car) {
            var act = car.finanzas.activo;
            var f = car.finanzas[act];
            var tasacion = 0;
            if(car.categorias && car.categorias.tasacion && car.categorias.tasacion.items.length > 0) {
                tasacion = Number(car.categorias.tasacion.items[0].val || 0);
            }
            
            var res = { costeTotal: 0, intereses: 0, capitalFinanciar: 0, balanceNeto: 0, sobrecoste: 0 };
            var pContado = Number(f.precioContado||0);
            
            if (act === 'contado') {
                res.costeTotal = pContado + Number(f.otros||0);
            } else {
                res.capitalFinanciar = Number(f.precioFinanciado||0) - Number(f.entrada||0);
                var cuotasTotales = Number(f.cuotaMensual||0) * Number(f.plazo||0);
                var cuotaF = act === 'flexible' ? Number(f.cuotaFinal||0) : 0;
                
                res.costeTotal = Number(f.entrada||0) + cuotasTotales + cuotaF + Number(f.comision||0) + Number(f.otros||0);
                if (res.capitalFinanciar > 0 && res.costeTotal > 0 && Number(f.precioFinanciado||0) > 0) {
                    res.intereses = Math.max(0, res.costeTotal - Number(f.precioFinanciado||0));
                }
                res.sobrecoste = res.costeTotal - pContado;
            }
            res.balanceNeto = res.costeTotal - tasacion;
            return res;
        }

        function evaluateMarket() {
            var minNeto = Infinity;
            var minIntereses = Infinity;
            var minComision = Infinity;

            for(var i=0; i<appData.length; i++) {
                var c = appData[i];
                var t = calculateFinanceTotals(c);
                var f = c.finanzas[c.finanzas.activo];
                
                if (t.balanceNeto > 0 && t.balanceNeto < minNeto) minNeto = t.balanceNeto;
                
                if (c.finanzas.activo !== 'contado' && t.intereses >= 0 && t.intereses < minIntereses) {
                    minIntereses = t.intereses;
                }
                
                var com = (c.finanzas.activo !== 'contado') ? (Number(f.comision||0) + Number(f.otros||0)) : Number(f.otros||0);
                if (com >= 0 && com < minComision) minComision = com;
            }

            for(var j=0; j<appData.length; j++) {
                var c2 = appData[j];
                if (!c2.categorias || !c2.categorias.precio) continue;
                var items = c2.categorias.precio.items;
                var t2 = calculateFinanceTotals(c2);
                var f2 = c2.finanzas[c2.finanzas.activo];
                
                var getP = function(idName) {
                    for(var k=0; k<items.length; k++){
                        if(items[k].id === idName) return items[k];
                    } return null;
                };

                var p1 = getP('p_coste');
                var p2 = getP('p_intereses');
                var p3 = getP('p_comision');

                if(p1) p1.val = (t2.balanceNeto > 0 && t2.balanceNeto === minNeto);
                if(p2) p2.val = (c2.finanzas.activo !== 'contado' && t2.intereses === minIntereses);
                
                var com2 = (c2.finanzas.activo !== 'contado') ? (Number(f2.comision||0) + Number(f2.otros||0)) : Number(f2.otros||0);
                if(p3) p3.val = (com2 === minComision);
            }
            saveData();
        }

        function calculateScore(car) {
            if (!car || !car.categorias) return 0;
            var total = 0;
            var totals = calculateFinanceTotals(car);
            
            for (var catId in CATEGORY_DEFS) {
                var cat = car.categorias[catId];
                if (!cat || !cat.items || cat.items.length === 0) continue;
                
                var weight = Number(appWeights[catId]);
                if (isNaN(weight)) weight = CATEGORY_DEFS[catId].weight;
                var numItems = cat.items.length;

                var rawScore = 0;
                var activeItemsCount = 0;

                for (var i=0; i<numItems; i++) {
                    var item = cat.items[i];
                    if (item.type === 'check' || item.type === 'check_auto') {
                        activeItemsCount++;
                        rawScore += (item.val === true || item.val === "true" || item.val === 1) ? 1 : 0;
                    } else if (item.type === 'select') {
                        // EXCLUSIÓN DE "PENDIENTE" (val === 0): Si está en pendiente, no penaliza ni cuenta en el denominador
                        if (Number(item.val || 0) !== 0) {
                            activeItemsCount++;
                            rawScore += Number(item.val || 0);
                        }
                    } else if (item.type === 'number_score') {
                        activeItemsCount++;
                        var valNum = Number(item.val || 0);
                        var minR = Number(item.minRef || 0);
                        var maxR = Number(item.maxRef || 1);
                        var diff = maxR - minR; if(diff===0) diff=1;
                        var ratio = (valNum - minR) / diff;
                        if (ratio > 1) ratio = 1; if (ratio < 0) ratio = 0;
                        rawScore += ratio;
                    }
                }
                
                var catPercent = activeItemsCount > 0 ? (rawScore / activeItemsCount) : 0;

                if (catId === 'precio' && car.finanzas && car.categorias.tasacion) {
                    var net = totals.balanceNeto;
                    var priceMathScore = 1 - ((net - 15000) / 25000); 
                    if (priceMathScore > 1) priceMathScore = 1; if (priceMathScore < 0) priceMathScore = 0;
                    total += ((priceMathScore * 0.7) + (catPercent * 0.3)) * weight;
                } else {
                    total += (catPercent * weight);
                }
            }
            
            if (isNaN(total)) return 0;
            return Math.min(100, Math.max(0, Math.round(total)));
        }

        // RENDERIZADOS
        function renderDashboard() {
            var list = document.getElementById('car-list');
            if (!list) return;
            
            var sortedData = appData.slice();
            sortedData.sort(function(a, b) { return calculateScore(b) - calculateScore(a); });
            var html = '';
            for(var i=0; i<sortedData.length; i++) {
                var c = sortedData[i];
                var score = calculateScore(c);
                var colorClass = score >= 80 ? 'score-80' : (score >= 50 ? 'score-60' : 'score-0');
                
                html += '<div class="car-card" onclick="showDetail(\'' + c.id + '\')">';
                html += '<div class="car-card-header">';
                html += '<div class="car-info">';
                html += '<h2>' + (c.marca || 'Marca') + ' ' + (c.modelo || 'Modelo') + '</h2>';
                html += '<h3>🏢 ' + (c.concesionario || 'Sin Concesionario') + '</h3>';
                html += '<p style="margin-top: 5px;">Precio/Info: <strong style="color:var(--text-color); margin-left:5px;">' + (c.precioCorto || '') + '</strong></p>';
                html += '</div>';
                html += '<div class="car-score ' + colorClass + '">' + score + '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

                    contentHtml += '<div class="data-group"><label>Al Contado (€)</label><input type="number" value="' + (f.precioContado||'') + '" oninput="handleFinInput(\'precioContado\', this.value)"></div>';
                    if (act !== 'contado') {
                        contentHtml += '<div class="data-group"><label>Financiado Base (€)</label><input type="number" value="' + (f.precioFinanciado||'') + '" oninput="handleFinInput(\'precioFinanciado\', this.value)"></div>';
                        contentHtml += '<div class="data-group"><label>Entrada (€)</label><input type="number" value="' + (f.entrada||'') + '" oninput="handleFinInput(\'entrada\', this.value)"></div>';
                        contentHtml += '<div class="data-group"><label>Plazo (Meses)</label><input type="number" value="' + (f.plazo||'') + '" oninput="handleFinInput(\'plazo\', this.value)"></div>';
                        contentHtml += '<div class="data-group"><label>Cuota Mensual (€)</label><input type="number" step="0.01" value="' + (f.cuotaMensual||'') + '" oninput="handleFinInput(\'cuotaMensual\', this.value)"></div>';
                        if (act === 'flexible') {
                            contentHtml += '<div class="data-group"><label>Cuota Final (€)</label><input type="number" value="' + (f.cuotaFinal||'') + '" oninput="handleFinInput(\'cuotaFinal\', this.value)"></div>';
                        }
                        contentHtml += '<div class="data-group"><label>Comisión Apertura (€)</label><input type="number" value="' + (f.comision||'') + '" oninput="handleFinInput(\'comision\', this.value)"></div>';
                        contentHtml += '<div class="data-group"><label>TAE (%)</label><input type="number" step="0.1" value="' + (f.tae||'') + '" oninput="handleFinInput(\'tae\', this.value)"></div>';
                    }
                    contentHtml += '<div class="data-group ' + (act==='contado'?'':'grid-full') + '"><label>Otros Gastos (€)</label><input type="number" value="' + (f.otros||'') + '" oninput="handleFinInput(\'otros\', this.value)"></div>';
                    contentHtml += '</div>';

                    contentHtml += '<div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px;">';
                    contentHtml += '<label style="display:flex; align-items:center; gap:5px; font-size:0.85rem;"><input type="checkbox" ' + (f.incluyePlanAuto?'checked':'') + ' onchange="handleFinInput(\'incluyePlanAuto\', this.checked, \'check\')"> Plan Auto</label>';
                    contentHtml += '<label style="display:flex; align-items:center; gap:5px; font-size:0.85rem;"><input type="checkbox" ' + (f.incluyeCae?'checked':'') + ' onchange="handleFinInput(\'incluyeCae\', this.checked, \'check\')"> CAE</label>';
                    contentHtml += '<label style="display:flex; align-items:center; gap:5px; font-size:0.85rem;"><input type="checkbox" ' + (f.incluyeCargador?'checked':'') + ' onchange="handleFinInput(\'incluyeCargador\', this.checked, \'check\')"> Cargador</label>';
                    contentHtml += '<label style="display:flex; align-items:center; gap:5px; font-size:0.85rem;"><input type="checkbox" ' + (f.incluyeMantenimiento?'checked':'') + ' onchange="handleFinInput(\'incluyeMantenimiento\', this.checked, \'check\')"> Mant. Incl.</label>';
                    contentHtml += '</div>';

                    contentHtml += '<div id="resumen-box" style="background:rgba(0,200,0,0.05); border:1px solid var(--neon-green); border-radius:8px; padding:15px; font-size:0.95rem;"></div></div>';
                }

                for (var j=0; j<cat.items.length; j++) {
                    var item = cat.items[j];
                    if (item.type === 'check') {
                        contentHtml += '<div class="check-item"><label><input type="checkbox" ' + (item.val?'checked':'') + ' onchange="handleItemInput(\'' + catId + '\', \'' + item.id + '\', this.checked, \'check\')"> ' + item.text + '</label><button class="remove-btn" onclick="removeItemGlobal(\'' + catId + '\', \'' + item.id + '\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
                    } else if (item.type === 'check_auto') {
                        var op = item.val ? '1' : '0.4';
                        contentHtml += '<div class="check-item" style="background:rgba(0,200,0,0.05); padding:10px; border-radius:6px;"><label id="lbl-auto-' + item.id + '" style="color:var(--neon-green); opacity:' + op + '"><input type="checkbox" id="chk-auto-' + item.id + '" ' + (item.val?'checked':'') + ' disabled> ' + item.text + '</label></div>';
                    } else if (item.type === 'select') {
                        contentHtml += '<div class="select-item"><div style="display:flex; justify-content:space-between; align-items:center;"><label style="color:var(--neon-green); font-weight:bold;">' + item.text + '</label><button class="remove-btn" onclick="removeItemGlobal(\'' + catId + '\', \'' + item.id + '\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
                        contentHtml += '<select onchange="handleItemInput(\'' + catId + '\', \'' + item.id + '\', this.value, \'select\')">';
                        for(var o=0; o<item.options.length; o++) {
                            var opt = item.options[o];
                            contentHtml += '<option value="' + opt.val + '" ' + (Number(item.val)===Number(opt.val)?'selected':'') + '>' + opt.label + '</option>';
                        }
                        contentHtml += '</select></div>';
                    } else if (item.type === 'number_score') {
                        contentHtml += '<div class="data-group" style="padding:10px;"><label>' + item.text + '</label><input type="number" value="' + (item.val||0) + '" oninput="handleItemInput(\'' + catId + '\', \'' + item.id + '\', this.value, \'number\')"></div>';
                    }
                }
                
                contentHtml += '<div class="add-equip-row"><input type="text" id="new-item-input-' + catId + '" placeholder="Añadir a toda la plantilla"><button class="action-btn small" onclick="addNewItemGlobal(\'' + catId + '\')">Añadir</button></div>';
                contentHtml += '</div>';
            }
            
            tabsWrapper.innerHTML = tabsHtml;
            contentContainer.innerHTML = contentHtml;
            
            for (var cId in CATEGORY_DEFS) updateProgressBarDOM(car, cId);
        }

        function switchTab(btnId, contentId) {
            var tabs = document.querySelectorAll('.tab');
            var contents = document.querySelectorAll('.tab-content');
            for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
            for(var j=0; j<contents.length; j++) contents[j].classList.remove('active');
            var btn = document.getElementById(btnId);
            var content = document.getElementById(contentId);
            if (btn) btn.classList.add('active');
            if (content) content.classList.add('active');
        }

        // CONTROLADORES DE INPUT UI V5.2
        function setTipoCompra(tipo) {
            var car = getCarById(currentCarId);
            if (!car) return;
            car.finanzas.activo = tipo;
            saveData();
            buildDetailHTML(car);
            switchTab('tab-btn-precio', 'tab-content-precio');
            updateFinanceSummaryDOM();
            evaluateMarket();
            renderDashboard();
        }

        function handleBaseInput(key, val) {
            var car = getCarById(currentCarId);
            if (!car) return;
            car[key] = val;
            saveData();
            if (key === 'marca' || key === 'modelo') {
                var title = document.getElementById('detail-title');
                if (title) title.innerText = (car.marca||'') + ' ' + (car.modelo||'');
            }
            if (key === 'img') {
                var head = document.getElementById('detail-header-container');
                if (head) {
                    var u = formatGoogleDriveUrl(val);
                    head.style.backgroundImage = u ? "url('" + u + "')" : "none";
                }
            }
        }

        function handleFinInput(key, val, type) {
            var car = getCarById(currentCarId);
            if (!car) return;
            var t = car.finanzas.activo;
            if (type === 'check') car.finanzas[t][key] = val;
            else car.finanzas[t][key] = val === '' ? 0 : Number(val);
            saveData();
            updateFinanceSummaryDOM(); 
        }

        function handleItemInput(catId, itemId, val, type) {
            var car = getCarById(currentCarId);
            if (!car) return;
            var items = car.categorias[catId].items;
            for(var i=0; i<items.length; i++){
                if(items[i].id === itemId) {
                    if (type === 'check') items[i].val = val;
                    else items[i].val = val === '' ? 0 : Number(val);
                    break;
                }
            }
            saveData();
            updateProgressBarDOM(car, catId);
            if (catId === 'tasacion') { updateFinanceSummaryDOM(); evaluateMarket(); renderDashboard(); }
            else { evaluateMarket(); renderDashboard(); }
        }

        function updateFinanceSummaryDOM() {
            var car = getCarById(currentCarId);
            if (!car) return;
            var act = car.finanzas.activo;
            var tTotals = calculateFinanceTotals(car);
            var tasacion = 0;
            if(car.categorias && car.categorias.tasacion && car.categorias.tasacion.items.length > 0) {
                tasacion = Number(car.categorias.tasacion.items[0].val || 0);
            }

            var box = document.getElementById('resumen-box');
            if (box) {
                var html = '';
                if (act === 'contado') {
                    html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between;"><span>Pago al Contado + Otros:</span> <strong>' + tTotals.costeTotal.toLocaleString('es-ES') + ' €</strong></p>';
                } else {
                    html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between; color:var(--text-muted);"><span>Capital a Financiar:</span> <span>' + tTotals.capitalFinanciar.toLocaleString('es-ES') + ' €</span></p>';
                    html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between; color:var(--text-muted);"><span>Intereses pagados al banco:</span> <span style="color:var(--score-red);">+' + tTotals.intereses.toLocaleString('es-ES') + ' €</span></p>';
                    html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between;"><strong>Coste Total de la Operación:</strong> <strong>' + tTotals.costeTotal.toLocaleString('es-ES') + ' €</strong></p>';
                    html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between; color:var(--text-muted); border-bottom:1px solid var(--border-color); padding-bottom:8px;"><span>Sobrecoste vs Pago Contado:</span> <span>+' + tTotals.sobrecoste.toLocaleString('es-ES') + ' €</span></p>';
                }
                html += '<p style="margin-bottom:8px; display:flex; justify-content:space-between; margin-top:10px;"><span>Tasación Coche Usado:</span> <span style="color:var(--neon-green);">- ' + tasacion.toLocaleString('es-ES') + ' €</span></p>';
                html += '<p style="margin-bottom:0; display:flex; justify-content:space-between;"><strong>BALANCE NETO REAL:</strong> <span style="font-size:1.15rem; font-weight:bold; color:' + (tTotals.balanceNeto < 0 ? 'var(--neon-green)' : 'var(--text-color)') + ';">' + tTotals.balanceNeto.toLocaleString('es-ES') + ' €</span></p>';
                box.innerHTML = html;
            }

            evaluateMarket();
            if(car.categorias.precio) {
                var items = car.categorias.precio.items;
                for(var i=0; i<items.length; i++) {
                    var chk = document.getElementById('chk-auto-' + items[i].id);
                    var lbl = document.getElementById('lbl-auto-' + items[i].id);
                    if(chk) chk.checked = items[i].val;
                    if(lbl) lbl.style.opacity = items[i].val ? '1' : '0.4';
                }
                updateProgressBarDOM(car, 'precio');
            }
            renderDashboard();
        }

        function updateProgressBarDOM(car, catId) {
            var cat = car.categorias[catId];
            if (!cat || !cat.items) return;
            var numItems = cat.items.length;
            var rawScore = 0;
            var activeItemsCount = 0;

            for(var i=0; i<numItems; i++) {
                var item = cat.items[i];
                if (item.type === 'check' || item.type === 'check_auto') {
                    activeItemsCount++;
                    rawScore += (item.val === true || item.val === "true" || item.val === 1 ? 1 : 0);
                } else if (item.type === 'select') {
                    if (Number(item.val || 0) !== 0) {
                        activeItemsCount++;
                        rawScore += Number(item.val || 0);
                    }
                } else if (item.type === 'number_score') {
                    activeItemsCount++;
                    var v = Number(item.val || 0);
                    var minR = Number(item.minRef || 0);
                    var maxR = Number(item.maxRef || 1);
                    var diff = maxR - minR; if(diff===0) diff=1;
                    var rat = (v - minR) / diff;
                    rawScore += Math.max(0, Math.min(1, rat));
                }
            }

            var perc = activeItemsCount > 0 ? (rawScore / activeItemsCount) * 100 : 0;
            if (isNaN(perc)) perc = 0;
            var visPerc = Math.max(0, Math.min(100, perc));
            var color = visPerc >= 80 ? 'var(--score-green)' : (visPerc >= 50 ? 'var(--score-yellow)' : 'var(--score-red)');
            
            var fill = document.getElementById('prog-fill-' + catId);
            var txt = document.getElementById('prog-txt-' + catId);
            if (fill) { fill.style.width = visPerc + '%'; fill.style.backgroundColor = color; }
            if (txt) { txt.innerText = Math.round(perc) + '%'; txt.style.color = color; }
        }

        // SISTEMA GLOBAL DE EQUIPAMIENTO
        function addNewItemGlobal(catId) {
            var input = document.getElementById('new-item-input-' + catId);
            if (!input) return;
            var val = input.value.trim();
            if (!val) return;

            var newItem = { id: "custom_" + Date.now(), text: val, type: "check", val: false };
            globalCategories[catId].items.push(newItem);
            localStorage.setItem('evcheck_v5_global_cats', JSON.stringify(globalCategories));

            for (var i=0; i<appData.length; i++) {
                appData[i].categorias[catId].items.push(JSON.parse(JSON.stringify(newItem)));
            }
            saveData();
            
            var car = getCarById(currentCarId);
            buildDetailHTML(car);
            switchTab('tab-btn-'+catId, 'tab-content-'+catId);
            evaluateMarket();
            renderDashboard();
        }

        function removeItemGlobal(catId, itemId) {
            if (itemId === 'p_coste' || itemId === 'p_intereses' || itemId === 'p_comision' || itemId === 't1') {
                alert("Este es un campo base matemático y no puede borrarse."); return;
            }
            if (!confirm("¿Borrar este elemento de TODAS las ofertas de tu garaje?")) return;
            
            var gItems = globalCategories[catId].items;
            var newGItems = [];
            for(var k=0; k<gItems.length; k++){ if(gItems[k].id !== itemId) newGItems.push(gItems[k]); }
            globalCategories[catId].items = newGItems;
            localStorage.setItem('evcheck_v5_global_cats', JSON.stringify(globalCategories));
            
            for (var i=0; i<appData.length; i++) {
                var cItems = appData[i].categorias[catId].items;
                var newCItems = [];
                for(var j=0; j<cItems.length; j++){ if(cItems[j].id !== itemId) newCItems.push(cItems[j]); }
                appData[i].categorias[catId].items = newCItems;
            }
            saveData();
            
            var car = getCarById(currentCarId);
            buildDetailHTML(car);
            switchTab('tab-btn-'+catId, 'tab-content-'+catId);
            evaluateMarket();
            renderDashboard();
        }

        // EXPORTACIÓN BLINDADA IOS
        function exportData() {
            var backup = { data: appData, weights: appWeights, version: APP_VERSION };
            var dataStr = JSON.stringify(backup, null, 2);
            try {
                var blob = new Blob([dataStr], { type: "application/json" });
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                var date = new Date();
                a.download = "EVcheck_V5_" + date.getFullYear() + "-" + (date.getMonth()+1) + "-" + date.getDate() + ".json";
                document.body.appendChild(a);
                a.click();
                setTimeout(function(){ 
                    document.body.removeChild(a); 
                    window.URL.revokeObjectURL(url);
                }, 200);
            } catch (e) {
                var copyText = document.createElement("textarea");
                copyText.value = dataStr;
                document.body.appendChild(copyText);
                copyText.select();
                document.execCommand("copy");
                document.body.removeChild(copyText);
                alert("La descarga directa está bloqueada por iOS. El código se ha COPIADO a tu portapapeles. Pégalo en Notas para guardarlo.");
            }
        }

        function sanitizeJSONString(rawText) {
            var text = rawText.replace(/\[span_\d+\]\((start_span|end_span)\)/g, '');
            text = text.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
            var start = text.indexOf('{'); var startArr = text.indexOf('[');
            var first = -1;
            if (start !== -1 && startArr !== -1) first = Math.min(start, startArr);
            else if (start !== -1) first = start;
            else if (startArr !== -1) first = startArr;
            var end = text.lastIndexOf('}'); var endArr = text.lastIndexOf(']');
            var last = -1;
            if (end !== -1 && endArr !== -1) last = Math.max(end, endArr);
            else if (end !== -1) last = end;
            else if (endArr !== -1) last = endArr;
            if (first !== -1 && last !== -1 && first < last) return text.substring(first, last + 1);
            return text.trim();
        }

        function importData(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var parsed = JSON.parse(sanitizeJSONString(e.target.result));
                    if (parsed.data && parsed.version) {
                        localStorage.setItem('evcheck_v5_data', JSON.stringify(parsed.data));
                        if(parsed.weights) localStorage.setItem('evcheck_v5_weights', JSON.stringify(parsed.weights));
                        alert('Copia V5 restaurada correctamente.'); location.reload();
                    } else alert('El archivo no es una copia de seguridad válida.');
                } catch (err) { alert('Error al restaurar. Archivo corrupto.'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function importSingleCar(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var parsed = JSON.parse(sanitizeJSONString(e.target.result));
                    var carsToAdd = Array.isArray(parsed) ? parsed : [parsed];
                    var added = 0;
                    for(var i=0; i<carsToAdd.length; i++) {
                        var data = carsToAdd[i];
                        var newCar = getNewCarTemplate(); 
                        newCar.id = "ev-" + Date.now() + Math.floor(Math.random() * 1000);
                        if(data.marca) newCar.marca = data.marca;
                        if(data.modelo) newCar.modelo = data.modelo;
                        if(data.concesionario) newCar.concesionario = data.concesionario;
                        if(data.precioCorto) newCar.precioCorto = data.precioCorto;
                        if(data.notas) newCar.notas = data.notas;
                        if(data.img) newCar.img = data.img;
                        if(data.finanzas) {
                            var t = data.finanzas.tipoCompra || 'contado';
                            newCar.finanzas.activo = t;
                            for(var fKey in data.finanzas) newCar.finanzas[t][fKey] = data.finanzas[fKey];
                        }
                        if (data.valores) {
                            for (var catKey in data.valores) {
                                if (newCar.categorias[catKey]) {
                                    for(var v=0; v<data.valores[catKey].length; v++) {
                                        if (newCar.categorias[catKey].items[v]) newCar.categorias[catKey].items[v].val = data.valores[catKey][v];
                                    }
                                }
                            }
                        }
                        appData.push(newCar);
                        added++;
                    }
                    if (added > 0) {
                        saveData(); alert('Se han importado ' + added + ' vehículo(s) correctamente.');
                        evaluateMarket(); renderDashboard();
                    }
                } catch (err) { alert('Error al leer el archivo JSON.'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function formatGoogleDriveUrl(url) {
            if (!url) return '';
            if (url.indexOf('drive.google.com') !== -1) {
                var match = url.match(/(?:file\/d\/|id=|open\?id=)([a-zA-Z0-9_-]{25,})/);
                if (match && match[1]) return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1200';
            }
            return url;
        }

        initApp(); 
    </script>
