<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            --neon-green: #00C800;
            --neon-glow: 0 0 10px rgba(0, 200, 0, 0.3);
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            --neon-green: #00A000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid var(--border-color); }
        .car-info h2 { font-size: 1.1rem; margin-bottom: 8px; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .car-info p span { display: flex; align-items: center; gap: 4px; }
        .car-score { background-color: rgba(0, 200, 0, 0.1); color: var(--neon-green); padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid var(--neon-green); }

        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 200px; background-size: cover; background-position: center; }
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, #0a0a0a); }
        body.light-mode .detail-header-overlay { background: linear-gradient(transparent, rgba(255,255,255,0.9)); }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; backdrop-filter: blur(5px); display: flex; align-items: center; gap: 6px; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--surface-color); overflow-x: auto; }
        .tab { flex: 1; text-align: center; padding: 12px 10px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .data-group input, .data-group select { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus { outline: none; border-color: var(--neon-green); }
        
        .offer-card { border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; background: var(--bg-color); position: relative; }
        .offer-header { color: var(--neon-green); font-weight: bold; margin-bottom: 15px; width: calc(100% - 30px); font-size: 1.1rem; background: transparent; border: none; outline: none; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px;}
        .delete-offer-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3b30; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; z-index: 10;}
        .offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .offer-grid .data-group { padding: 8px; margin: 0; background: var(--surface-color); border: 1px solid var(--border-color); }
        .offer-grid .data-group.full-width { grid-column: 1 / -1; }
        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-color); }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--neon-green); }

        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 10px; }
        .check-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--neon-green); }
        .remove-btn { background: none; border: none; color: #ff3b30; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
        
        .add-equip-row { display: flex; gap: 10px; margin-top: 20px; }
        .add-equip-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        button.action-btn.small { width: auto; padding: 10px 20px; margin-top: 0; }
        
        .version-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--surface-color); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); margin-left: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="margin-right: 10px; border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <defs>
                <filter id="neonGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#39FF14" flood-opacity="0.8"/>
                </filter>
              </defs>
              <g filter="url(#neonGlowHeader)" stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="3" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" id="settings-btn" aria-label="Ajustes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; border: none; padding: 0;">Acerca de EVcheck</h3>
            <span class="version-tag" id="app-version-display"></span>
        </div>

        <div class="config-section">
            <h3>Datos y Copias de Seguridad</h3>
            <button class="action-btn secondary" onclick="exportData()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar Datos (Backup)
            </button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Restaurar Datos
            </button>
        </div>

        <div class="config-section">
            <h3>Sistema</h3>
            <div class="weight-row" style="border:none; padding:0 0 5px 0;">
                <label for="theme-select">Tema de la aplicación</label>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <option value="auto">Automático (Sistema)</option>
                    <option value="dark">Forzar Noche</option>
                    <option value="light">Forzar Día</option>
                </select>
            </div>
            <button class="action-btn secondary" style="margin-top: 15px;" onclick="checkOTA()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                Buscar Actualizaciones OTA
            </button>
            <p id="ota-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;"></p>
        </div>

        <div class="config-section">
            <h3>Pesos de Puntuación (%)</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">La suma total debe ser 100.</p>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Total:</label>
                <span id="weight-total">100%</span>
            </div>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-image" style="background-image: url('');">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Volver
            </button>
            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('specs')">Técnica</div>
            <div class="tab" onclick="switchTab('offers')">Financiación</div>
            <div class="tab" onclick="switchTab('equipment')">Equipamiento</div>
            <div class="tab" onclick="switchTab('rating')">Valoración</div>
        </div>

        <div id="specs" class="tab-content active"></div>
        
        <div id="offers" class="tab-content">
            <div id="offers-list"></div>
            <button class="action-btn" onclick="addOffer()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Nueva Oferta
            </button>
        </div>
        
        <div id="equipment" class="tab-content">
            <div class="data-group" style="padding: 0;">
                <div id="equipment-list" style="padding: 0 15px;"></div>
            </div>
            <div class="add-equip-row">
                <input type="text" id="new-equip-input" placeholder="Ej. Llantas 19 pulgadas">
                <button class="action-btn small" onclick="addEquipment()">Añadir</button>
            </div>
        </div>
        
        <div id="rating" class="tab-content"></div>
    </div>

    <script>
        const APP_VERSION = "v1.4.3";
        
        const defaultWeights = { bateria: 25, precio: 20, habitabilidad: 20, dinamica: 15, software: 10, seguridad: 10 };
        
        const defaultEquip = [
            { nombre: "Conducción One Pedal", marcado: false },
            { nombre: "Levas de regeneración en volante", marcado: false },
            { nombre: "Bomba de calor", marcado: false },
            { nombre: "Preacondicionamiento de batería", marcado: false },
            { nombre: "Climatizador bizona", marcado: false },
            { nombre: "Climatización 'Driver Only'", marcado: false },
            { nombre: "Alerta de ángulo muerto", marcado: false },
            { nombre: "Cámaras 360º", marcado: false },
            { nombre: "Control de crucero adaptativo (ACC)", marcado: false },
            { nombre: "Centrado de carril activo", marcado: false },
            { nombre: "Faros Matrix LED adaptativos", marcado: false },
            { nombre: "Apple CarPlay / Android Auto inalámbrico", marcado: false },
            { nombre: "Asientos calefactables", marcado: false },
            { nombre: "Volante calefactable", marcado: false },
            { nombre: "Techo panorámico", marcado: false },
            { nombre: "Frunk (Maletero delantero)", marcado: false },
            { nombre: "V2L (Carga de dispositivos externos)", marcado: false }
        ];

        const defaultData = [
            {
                id: "kia-ev3-lr", marca: "KIA", modelo: "EV3 Earth Long Range",
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Kia_EV3_GT-Line_SV3_IAA_2024_1X7A0436.jpg/800px-Kia_EV3_GT-Line_SV3_IAA_2024_1X7A0436.jpg",
                tecnica: { quimica: "NMC", bateria: 78, wltp: 605, consumoOficial: 14.9, potenciaCargaDc: 135 },
                ofertas: [{ 
                    concesionario: "KIA Autopista Sur", 
                    precioAlContado: 37850, 
                    precioFinanciado: 34489, 
                    tasacionNissanQashqai: 14000,
                    tipoFinanciacion: "flexible",
                    entrada: 8000, meses: 48, cuotaMensual: 249, cuotaFinal: 18500, tin: 6.5, tae: 7.9,
                    incluyePlanAuto: true, incluyeCae: false, incluyeCargador: true
                }],
                equipamiento: JSON.parse(JSON.stringify(defaultEquip)),
                puntuaciones: { exterior: 7, interior: 8, dinamica: 8, software: 7, habitabilidad: 8, seguridad: 9 }
            },
            {
                id: "byd-atto3-evo", marca: "BYD", modelo: "ATTO 3 EVO",
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/BYD_Atto_3_%282022%29_1.jpg/800px-BYD_Atto_3_%282022%29_1.jpg",
                tecnica: { quimica: "LFP CTB", bateria: 74.8, wltp: 510, consumoOficial: 16.0, potenciaCargaDc: 220 },
                ofertas: [{ 
                    concesionario: "BYD Valencia", 
                    precioAlContado: 36200, 
                    precioFinanciado: 36200, 
                    tasacionNissanQashqai: 13500,
                    tipoFinanciacion: "lineal",
                    entrada: 0, meses: 0, cuotaMensual: 0, cuotaFinal: 0, tin: 0, tae: 0,
                    incluyePlanAuto: false, incluyeCae: false, incluyeCargador: false
                }],
                equipamiento: JSON.parse(JSON.stringify(defaultEquip)),
                puntuaciones: { exterior: 8, interior: 7, dinamica: 7, software: 8, habitabilidad: 7, seguridad: 8 }
            }
        ];

        let appData = JSON.parse(localStorage.getItem('evcheck_data'));
        
        if (appData) {
            appData.forEach(car => {
                defaultEquip.forEach(defaultEq => {
                    if (!car.equipamiento || !car.equipamiento.some(eq => eq.nombre === defaultEq.nombre)) {
                        if (!car.equipamiento) car.equipamiento = [];
                        car.equipamiento.push({...defaultEq});
                    }
                });
                car.ofertas.forEach(o => {
                    if (o.precioAlContado === undefined) {
                        o.precioAlContado = o.precioTarifa || o.precioNetoPromesas || 0;
                        o.precioFinanciado = o.precioNetoPromesas || 0;
                        o.tipoFinanciacion = "flexible";
                        o.entrada = 0; o.meses = 0; o.cuotaMensual = 0; o.cuotaFinal = 0; o.tin = 0; o.tae = 0;
                        o.incluyePlanAuto = false; o.incluyeCae = false; o.incluyeCargador = false;
                    }
                });
            });
        } else {
            appData = defaultData;
        }

        let appWeights = JSON.parse(localStorage.getItem('evcheck_weights'));
        if (!appWeights || Object.keys(appWeights).length === 0) {
            appWeights = defaultWeights;
        } else {
            appWeights = { ...defaultWeights, ...appWeights };
        }

        let currentCarId = null;

        let currentThemeSetting = localStorage.getItem('evcheck_theme_mode') || 'auto';
        const mediaQueryLight = window.matchMedia('(prefers-color-scheme: light)');

        function applyTheme(setting) {
            let isLight = false;
            if (setting === 'auto') isLight = mediaQueryLight.matches;
            else isLight = (setting === 'light');
            document.body.classList.toggle('light-mode', isLight);
        }

        function changeTheme() {
            currentThemeSetting = document.getElementById('theme-select').value;
            localStorage.setItem('evcheck_theme_mode', currentThemeSetting);
            applyTheme(currentThemeSetting);
        }

        mediaQueryLight.addEventListener('change', () => {
            if (currentThemeSetting === 'auto') applyTheme('auto');
        });

        window.onload = () => {
            document.getElementById('app-version-display').innerText = APP_VERSION;
            document.getElementById('theme-select').value = currentThemeSetting;
            applyTheme(currentThemeSetting);
            renderDashboard();
            renderWeightsConfig();
        };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            document.getElementById('settings-btn').style.display = viewId === 'detail-view' ? 'none' : 'flex';
            document.getElementById('header-title').innerText = viewId === 'settings-view' ? 'Configuración' : 'EVcheck';
            
            if (viewId === 'dashboard-view') renderDashboard();
        }

        function toggleSettings() {
            const currentView = document.querySelector('.view.active').id;
            showView(currentView === 'settings-view' ? 'dashboard-view' : 'settings-view');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function exportData() {
            const backup = { data: appData, weights: appWeights };
            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `EVcheck_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.data && parsed.weights) {
                        localStorage.setItem('evcheck_data', JSON.stringify(parsed.data));
                        localStorage.setItem('evcheck_weights', JSON.stringify(parsed.weights));
                        alert('Copia de seguridad restaurada correctamente. La aplicación se recargará.');
                        location.reload();
                    } else {
                        alert('El archivo no tiene el formato correcto de EVcheck.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function checkOTA() {
            const status = document.getElementById('ota-status');
            status.innerText = "Buscando actualizaciones...";
            setTimeout(() => {
                status.innerText = `EVcheck está en la última versión (${APP_VERSION}).`;
                setTimeout(() => status.innerText = "", 3000);
            }, 1500);
        }

        function renderWeightsConfig() {
            const container = document.getElementById('weights-container');
            const labels = { bateria: 'Batería y Carga', precio: 'Precio', habitabilidad: 'Habitabilidad', dinamica: 'Dinámica', software: 'Software', seguridad: 'Seguridad' };
            container.innerHTML = Object.keys(appWeights).map(key => `
                <div class="weight-row">
                    <label>${labels[key]}</label>
                    <!-- Cambiado de onchange a oninput para guardar en tiempo real al escribir -->
                    <input type="number" min="0" max="100" value="${appWeights[key]}" oninput="updateWeight('${key}', this.value)">
                </div>
            `).join('');
            updateTotalWeight();
        }

        function updateWeight(key, value) {
            appWeights[key] = Number(value);
            localStorage.setItem('evcheck_weights', JSON.stringify(appWeights));
            updateTotalWeight();
        }

        function updateTotalWeight() {
            const total = Object.values(appWeights).reduce((a, b) => a + b, 0);
            const totalEl = document.getElementById('weight-total');
            totalEl.innerText = `${total}%`;
            totalEl.style.color = total === 100 ? 'var(--neon-green)' : '#ff3b30';
        }

        function calculateScore(car) {
            let score = 0;
            const w = appWeights;
            
            let batScore = Math.min(((car.tecnica.bateria / 80) * 5) + ((car.tecnica.wltp / 600) * 5), 10);
            score += batScore * (w.bateria / 10);

            let minPrice = car.ofertas.length ? Math.min(...car.ofertas.map(o => o.precioAlContado || 40000)) : 40000;
            let priceScore = Math.max(10 - ((minPrice - 20000) / 2500), 1);
            score += priceScore * (w.precio / 10);

            const pts = car.puntuaciones;
            score += pts.habitabilidad * (w.habitabilidad / 10);
            score += pts.dinamica * (w.dinamica / 10);
            score += pts.software * (w.software / 10);
            score += pts.seguridad * (w.seguridad / 10);

            const activeEquip = car.equipamiento.filter(e => e.marcado).length;
            score += (activeEquip * 0.5);

            return Math.min(Math.round(score), 100);
        }

        function renderDashboard() {
            const list = document.getElementById('car-list');
            appData.sort((a, b) => calculateScore(b) - calculateScore(a));
            list.innerHTML = appData.map(car => {
                let mejorPrecio = car.ofertas.length ? Math.min(...car.ofertas.map(o => o.precioAlContado)).toLocaleString('es-ES') + " €" : "Sin oferta";
                return `
                <div class="car-card" onclick="showDetail('${car.id}')">
                    <div class="car-info">
                        <h2>${car.marca} ${car.modelo}</h2>
                        <p>
                            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg> ${car.tecnica.bateria} kWh</span> | 
                            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v12l-6 3-6-3-6 3V6z"/></svg> ${car.tecnica.wltp} km</span>
                        </p>
                        <p style="color: var(--neon-green); margin-top: 5px;">Base: ${mejorPrecio}</p>
                    </div>
                    <div class="car-score">${calculateScore(car)}</div>
                </div>`;
            }).join('');
        }

        function showDetail(id) {
            currentCarId = id;
            const car = appData.find(c => c.id === id);
            
            document.getElementById('detail-title').innerText = `${car.marca} ${car.modelo}`;
            document.getElementById('detail-image').style.backgroundImage = `url('${car.img}')`;
            
            renderSpecs(car);
            renderOffers(car);
            renderEquipment(car);
            renderRatings(car);
            
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i===0);
                document.querySelectorAll('.tab-content')[i].classList.toggle('active', i===0);
            });
            showView('detail-view');
        }

        function renderSpecs(car) {
            const fields = [
                { k: 'quimica', l: 'Química', type: 'text' },
                { k: 'bateria', l: 'Batería (kWh)', type: 'number' },
                { k: 'wltp', l: 'WLTP (km)', type: 'number' },
                { k: 'potenciaCargaDc', l: 'Carga DC (kW)', type: 'number' }
            ];
            document.getElementById('specs').innerHTML = fields.map(f => `
                <div class="data-group">
                    <label>${f.l}</label>
                    <input type="${f.type}" value="${car.tecnica[f.k]}" onchange="updateCarData('tecnica', '${f.k}', this.value)">
                </div>
            `).join('');
        }

        function renderOffers(car) {
            document.getElementById('offers-list').innerHTML = car.ofertas.map((o, i) => {
                const totalFinanciacion = (o.entrada || 0) + ((o.cuotaMensual || 0) * (o.meses || 0)) + (o.tipoFinanciacion === 'flexible' ? (o.cuotaFinal || 0) : 0);
                const intereses = totalFinanciacion - (o.precioFinanciado || 0);
                const vsContado = totalFinanciacion - (o.precioAlContado || 0);

                return `
                <div class="offer-card">
                    <button class="delete-offer-btn" onclick="deleteOffer(${i})" aria-label="Borrar Oferta">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                    <input type="text" class="offer-header" value="${o.concesionario}" onchange="updateOffer(${i}, 'concesionario', this.value, 'text')" placeholder="Nombre del Concesionario">
                    
                    <div class="offer-grid">
                        <div class="data-group">
                            <label>Precio al Contado (€)</label>
                            <input type="number" value="${o.precioAlContado}" onchange="updateOffer(${i}, 'precioAlContado', this.value, 'number')">
                        </div>
                        <div class="data-group">
                            <label>Precio Financiado (Base) (€)</label>
                            <input type="number" value="${o.precioFinanciado}" onchange="updateOffer(${i}, 'precioFinanciado', this.value, 'number')">
                        </div>
                        <div class="data-group full-width">
                            <label>Tasación Qashqai (€) (A restar)</label>
                            <input type="number" value="${o.tasacionNissanQashqai}" onchange="updateOffer(${i}, 'tasacionNissanQashqai', this.value, 'number')">
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <label><input type="checkbox" ${o.incluyePlanAuto ? 'checked' : ''} onchange="updateOffer(${i}, 'incluyePlanAuto', this.checked, 'checkbox')"> Incluye Plan Auto+</label>
                        <label><input type="checkbox" ${o.incluyeCae ? 'checked' : ''} onchange="updateOffer(${i}, 'incluyeCae', this.checked, 'checkbox')"> Incluye CAE</label>
                        <label>
                            <input type="checkbox" ${o.incluyeCargador ? 'checked' : ''} onchange="updateOffer(${i}, 'incluyeCargador', this.checked, 'checkbox')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
                            Cargador Doméstico
                        </label>
                    </div>

                    <h4 style="margin-bottom: 10px; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Condiciones de Financiación</h4>
                    
                    <div class="offer-grid">
                        <div class="data-group full-width">
                            <label>Tipo de Financiación</label>
                            <select onchange="updateOffer(${i}, 'tipoFinanciacion', this.value, 'text')">
                                <option value="lineal" ${o.tipoFinanciacion === 'lineal' ? 'selected' : ''}>Lineal Tradicional</option>
                                <option value="flexible" ${o.tipoFinanciacion === 'flexible' ? 'selected' : ''}>Flexible / Multiopción (Con Cuota Final)</option>
                            </select>
                        </div>
                        <div class="data-group">
                            <label>Entrada (€)</label>
                            <input type="number" value="${o.entrada}" onchange="updateOffer(${i}, 'entrada', this.value, 'number')">
                        </div>
                        <div class="data-group">
                            <label>Plazo (Meses)</label>
                            <input type="number" value="${o.meses}" onchange="updateOffer(${i}, 'meses', this.value, 'number')">
                        </div>
                        <div class="data-group">
                            <label>Cuota Mensual (€)</label>
                            <input type="number" value="${o.cuotaMensual}" onchange="updateOffer(${i}, 'cuotaMensual', this.value, 'number')">
                        </div>
                        ${o.tipoFinanciacion === 'flexible' ? `
                        <div class="data-group">
                            <label>Cuota Final (€)</label>
                            <input type="number" value="${o.cuotaFinal}" onchange="updateOffer(${i}, 'cuotaFinal', this.value, 'number')">
                        </div>` : ''}
                        <div class="data-group">
                            <label>TIN (%)</label>
                            <input type="number" step="0.1" value="${o.tin}" onchange="updateOffer(${i}, 'tin', this.value, 'number')">
                        </div>
                        <div class="data-group">
                            <label>TAE (%)</label>
                            <input type="number" step="0.1" value="${o.tae}" onchange="updateOffer(${i}, 'tae', this.value, 'number')">
                        </div>
                    </div>

                    <div style="background: rgba(0, 200, 0, 0.05); border: 1px solid var(--neon-green); border-radius: 8px; padding: 15px; font-size: 0.95rem; margin-top: 15px;">
                        <p style="margin-bottom: 8px; display: flex; justify-content: space-between;">
                            <strong>Coste Total Real Financiado:</strong> 
                            <span style="color:var(--neon-green); font-size:1.15rem; font-weight: bold;">${totalFinanciacion.toLocaleString('es-ES')} €</span>
                        </p>
                        <p style="margin-bottom: 5px; color: var(--text-muted); display: flex; justify-content: space-between;">
                            <span>Intereses y gastos del crédito:</span> 
                            <span>${intereses > 0 ? intereses.toLocaleString('es-ES') : 0} €</span>
                        </p>
                        <p style="color: var(--text-muted); display: flex; justify-content: space-between;">
                            <span>Sobrecoste frente al Contado:</span> 
                            <span style="color: ${vsContado > 0 ? '#ff3b30' : 'var(--text-muted)'}">${vsContado > 0 ? '+' : ''}${vsContado.toLocaleString('es-ES')} €</span>
                        </p>
                    </div>
                </div>
                `;
            }).join('');
        }

        function updateOffer(idx, key, val, type) {
            const car = appData.find(c => c.id === currentCarId);
            if (type === 'checkbox') car.ofertas[idx][key] = val;
            else if (type === 'number') car.ofertas[idx][key] = Number(val);
            else car.ofertas[idx][key] = val;
            
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            renderOffers(car); 
            const backupView = document.querySelector('.view.active').id; 
            renderDashboard();
            if(backupView === 'detail-view') document.getElementById('dashboard-view').classList.remove('active');
        }

        function deleteOffer(idx) {
            if (confirm("¿Estás seguro de que deseas eliminar esta oferta?")) {
                const car = appData.find(c => c.id === currentCarId);
                car.ofertas.splice(idx, 1);
                localStorage.setItem('evcheck_data', JSON.stringify(appData));
                renderOffers(car);
                const backupView = document.querySelector('.view.active').id; 
                renderDashboard();
                if(backupView === 'detail-view') document.getElementById('dashboard-view').classList.remove('active');
            }
        }

        function addOffer() {
            const car = appData.find(c => c.id === currentCarId);
            car.ofertas.push({ 
                concesionario: "Nuevo Concesionario", 
                precioAlContado: 0, precioFinanciado: 0, tasacionNissanQashqai: 0,
                tipoFinanciacion: "flexible", entrada: 0, meses: 0, cuotaMensual: 0, cuotaFinal: 0, tin: 0, tae: 0,
                incluyePlanAuto: false, incluyeCae: false, incluyeCargador: false
            });
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            renderOffers(car);
        }

        function renderEquipment(car) {
            document.getElementById('equipment-list').innerHTML = car.equipamiento.map((eq, i) => `
                <div class="check-item">
                    <label>
                        <input type="checkbox" ${eq.marcado ? 'checked' : ''} onchange="toggleEquip(${i}, this.checked)">
                        ${eq.nombre}
                    </label>
                    <button class="remove-btn" onclick="removeEquip(${i})" aria-label="Eliminar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function renderRatings(car) {
            const fields = [
                { k: 'habitabilidad', l: 'Habitabilidad (1-10)' },
                { k: 'dinamica', l: 'Dinámica (1-10)' },
                { k: 'software', l: 'Software (1-10)' },
                { k: 'seguridad', l: 'Seguridad (1-10)' }
            ];
            document.getElementById('rating').innerHTML = fields.map(f => `
                <div class="data-group">
                    <label>${f.l}</label>
                    <input type="number" min="1" max="10" value="${car.puntuaciones[f.k]}" onchange="updateCarData('puntuaciones', '${f.k}', this.value)">
                </div>
            `).join('');
        }

        function updateCarData(cat, key, val) {
            const car = appData.find(c => c.id === currentCarId);
            car[cat][key] = isNaN(val) ? val : Number(val);
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
        }

        function toggleEquip(idx, isChecked) {
            const car = appData.find(c => c.id === currentCarId);
            car.equipamiento[idx].marcado = isChecked;
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            showView('dashboard-view'); showDetail(currentCarId);
        }

        function addEquipment() {
            const input = document.getElementById('new-equip-input');
            const val = input.value.trim();
            if(!val) return;
            const car = appData.find(c => c.id === currentCarId);
            car.equipamiento.push({ nombre: val, marcado: true });
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            input.value = '';
            renderEquipment(car);
            showView('dashboard-view'); showDetail(currentCarId);
        }

        function removeEquip(idx) {
            const car = appData.find(c => c.id === currentCarId);
            car.equipamiento.splice(idx, 1);
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            renderEquipment(car);
            showView('dashboard-view'); showDetail(currentCarId);
        }
    </script>
</body>
</html>
