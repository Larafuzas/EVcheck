<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            
            --score-green: #00C800;
            --score-yellow: #FFD60A;
            --score-orange: #FF9F0A;
            --score-red: #FF453A;
            
            --neon-green: var(--score-green);
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            
            --score-green: #34C759;
            --score-yellow: #FFCC00;
            --score-orange: #FF9500;
            --score-red: #FF3B30;
            
            --neon-green: var(--score-green);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid var(--border-color); }
        .car-info h2 { font-size: 1.1rem; margin-bottom: 8px; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .car-info p span { display: flex; align-items: center; gap: 4px; }
        
        .car-score { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid; min-width: 60px; text-align: center; }
        .score-80 { background-color: rgba(52, 199, 89, 0.1); color: var(--score-green); border-color: var(--score-green); }
        .score-60 { background-color: rgba(255, 204, 0, 0.1); color: var(--score-yellow); border-color: var(--score-yellow); }
        .score-45 { background-color: rgba(255, 149, 0, 0.1); color: var(--score-orange); border-color: var(--score-orange); }
        .score-0  { background-color: rgba(255, 59, 48, 0.1); color: var(--score-red); border-color: var(--score-red); }

        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 180px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); overflow: hidden;}
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, var(--bg-color)); }
        
        .back-btn { position: absolute; top: 15px; left: 15px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 10; }
        .delete-car-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,59,48,0.1); color: var(--score-red); border: 1px solid var(--score-red); padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        /* Botón de Imagen SVG Central */
        .view-image-btn { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 10px; background: rgba(0, 200, 0, 0.05); border: 1px solid var(--neon-green); border-radius: 12px; z-index: 5; box-shadow: var(--neon-glow); }
        .view-image-btn p { color: var(--neon-green); font-size: 0.8rem; font-weight: bold; margin-top: 8px; }

        .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--surface-color); overflow-x: auto; }
        .tab { flex: 1; text-align: center; padding: 12px 10px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .data-group input, .data-group select { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus { outline: none; border-color: var(--neon-green); }
        
        .offer-card { border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; background: var(--bg-color); position: relative; }
        .offer-header { color: var(--neon-green); font-weight: bold; margin-bottom: 15px; width: calc(100% - 30px); font-size: 1.1rem; background: transparent; border: none; outline: none; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px;}
        .delete-offer-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--score-red); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; z-index: 10;}
        .offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .offer-grid .data-group { padding: 8px; margin: 0; background: var(--surface-color); border: 1px solid var(--border-color); }
        .offer-grid .data-group.full-width { grid-column: 1 / -1; }
        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-color); }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--neon-green); }

        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 10px; }
        .check-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--neon-green); }
        .remove-btn { background: none; border: none; color: var(--score-red); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
        
        .add-equip-row { display: flex; gap: 10px; margin-top: 20px; }
        .add-equip-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        button.action-btn.small { width: auto; padding: 10px 20px; margin-top: 0; }
        
        .version-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--surface-color); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); margin-left: 10px; }
        .section-title { color: var(--neon-green); margin: 25px 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-size: 1.05rem; }

        /* Modal de Imagen */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { position: relative; width: 100%; height: 85%; max-width: 800px; background: var(--surface-color); border-radius: 12px; overflow: hidden; border: 1px solid var(--neon-green); box-shadow: var(--neon-glow); }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: var(--neon-green); border: 1px solid var(--neon-green); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="margin-right: 10px; border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <defs>
                <filter id="neonGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#39FF14" flood-opacity="0.8"/>
                </filter>
              </defs>
              <g filter="url(#neonGlowHeader)" stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="3" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" id="settings-btn" aria-label="Ajustes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
        <button class="action-btn" onclick="addNewCar()" style="margin-top: 20px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Añadir Nuevo Vehículo
        </button>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; border: none; padding: 0;">Acerca de EVcheck</h3>
            <span class="version-tag" id="app-version-display"></span>
        </div>

        <div class="config-section">
            <h3>Datos y Copias de Seguridad</h3>
            <button class="action-btn secondary" onclick="exportData()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar Datos (Backup)
            </button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Restaurar Datos
            </button>
        </div>

        <div class="config-section">
            <h3>Sistema</h3>
            <div class="weight-row" style="border:none; padding:0 0 5px 0;">
                <label for="theme-select">Tema de la aplicación</label>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <option value="auto">Automático (Sistema)</option>
                    <option value="dark">Forzar Noche</option>
                    <option value="light">Forzar Día</option>
                </select>
            </div>
            <button class="action-btn secondary" style="margin-top: 15px;" onclick="checkOTA()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                Buscar Actualizaciones OTA
            </button>
            <p id="ota-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;"></p>
        </div>

        <div class="config-section">
            <h3>Pesos de Puntuación (%)</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">La suma total debe ser 100.</p>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Total:</label>
                <span id="weight-total">100%</span>
            </div>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-header-container">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Volver
            </button>
            <button class="delete-car-btn" onclick="deleteCurrentCar()" aria-label="Eliminar Vehículo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            
            <!-- Botón SVG de Galería -->
            <div id="view-image-btn" class="view-image-btn" onclick="openImageModal()" style="display: none;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>Ver Foto</p>
            </div>

            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('specs')">Técnica</div>
            <div class="tab" onclick="switchTab('offers')">Financiación</div>
            <div class="tab" onclick="switchTab('equipment')">Equipamiento</div>
            <div class="tab" onclick="switchTab('rating')">Valoración</div>
        </div>

        <div id="specs" class="tab-content active"></div>
        <div id="offers" class="tab-content">
            <div id="offers-list"></div>
            <button class="action-btn" onclick="addOffer()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Nueva Oferta
            </button>
        </div>
        <div id="equipment" class="tab-content">
            <div class="data-group" style="padding: 0;">
                <div id="equipment-list" style="padding: 0 15px;"></div>
            </div>
            <div class="add-equip-row">
                <input type="text" id="new-equip-input" placeholder="Ej. Llantas 19 pulgadas">
                <button class="action-btn small" onclick="addEquipment()">Añadir a Todos</button>
            </div>
        </div>
        <div id="rating" class="tab-content"></div>
    </div>

    <!-- Modal para ver imagen/Drive -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const APP_VERSION = "v1.9.0";
        
        const defaultWeights = { bateria: 20, precio: 20, diseno_calidad: 15, funcionalidad: 15, dinamica: 15, tecnologia: 15 };
        
        const defaultEquip = [
            { nombre: "Bomba de calor", marcado: false },
            { nombre: "Sistema V2L (Vehicle-to-Load)", marcado: false },
            { nombre: "Cargador embarcado de 22 kW (CA)", marcado: false },
            { nombre: "Cable de carga Tipo 2 (Modo 3)", marcado: false },
            { nombre: "Cargador portátil de emergencia (Modo 2 / Schuko)", marcado: false },
            { nombre: "Preacondicionamiento de batería", marcado: false },
            { nombre: "Sistema de frenada regenerativa ajustable", marcado: false },
            { nombre: "Levas en el volante para regeneración", marcado: false },
            { nombre: "Función de conducción One-Pedal", marcado: false },
            { nombre: "Control de crucero adaptativo inteligente", marcado: false },
            { nombre: "Sistema de centrado y mantenimiento de carril", marcado: false },
            { nombre: "Alerta de ángulo muerto", marcado: false },
            { nombre: "Cámaras de visión 360º", marcado: false },
            { nombre: "Sensores de aparcamiento delanteros y traseros", marcado: false },
            { nombre: "Cámaras de grabación de entorno (Modo centinela)", marcado: false },
            { nombre: "Frunk (maletero delantero)", marcado: false },
            { nombre: "Organizadores de cables para el maletero o frunk", marcado: false },
            { nombre: "Portón del maletero con apertura eléctrica y función manos libres", marcado: false },
            { nombre: "Kit antipinchazos", marcado: false },
            { nombre: "Compresor de aire portátil", marcado: false },
            { nombre: "Baliza de emergencia V-16 conectada", marcado: false },
            { nombre: "Climatizador bizona", marcado: false },
            { nombre: "Climatización 'Driver Only'", marcado: false },
            { nombre: "Asientos delanteros y traseros calefactables", marcado: false },
            { nombre: "Asientos ventilados", marcado: false },
            { nombre: "Volante calefactable", marcado: false },
            { nombre: "Llantas aerodinámicas", marcado: false },
            { nombre: "Neumáticos de baja resistencia a la rodadura específicos para VE", marcado: false },
            { nombre: "Sistema de infoentretenimiento con planificador de rutas y puntos de carga", marcado: false },
            { nombre: "Apple CarPlay / Android Auto inalámbrico", marcado: false },
            { nombre: "Conectividad 4G/5G integrada", marcado: false },
            { nombre: "Capacidad de actualizaciones OTA (Over-The-Air)", marcado: false },
            { nombre: "Aplicación móvil para control remoto (carga, clima, apertura)", marcado: false },
            { nombre: "Faros Matrix LED o Full LED adaptativos", marcado: false },
            { nombre: "Head-Up Display (HUD)", marcado: false },
            { nombre: "Cargador inalámbrico para smartphones", marcado: false },
            { nombre: "Techo de cristal panorámico", marcado: false },
            { nombre: "Puertos USB-C delanteros y traseros", marcado: false },
            { nombre: "Sistema de sonido premium", marcado: false },
            { nombre: "Cristales tintados y acústicos", marcado: false }
        ];

        let globalEquipList = JSON.parse(localStorage.getItem('evcheck_global_equip')) || [];
        
        defaultEquip.forEach(defaultEq => {
            if (!globalEquipList.some(eq => eq.nombre === defaultEq.nombre)) {
                globalEquipList.push({...defaultEq});
            }

        function exportData() {
            const backup = { data: appData, weights: appWeights, globalEquip: globalEquipList };
            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `EVcheck_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.data && parsed.weights) {
                        localStorage.setItem('evcheck_data', JSON.stringify(parsed.data));
                        localStorage.setItem('evcheck_weights', JSON.stringify(parsed.weights));
                        if(parsed.globalEquip) {
                            localStorage.setItem('evcheck_global_equip', JSON.stringify(parsed.globalEquip));
                        }
                        alert('Copia de seguridad restaurada correctamente. La aplicación se recargará.');
                        location.reload();
                    } else {
                        alert('El archivo no tiene el formato correcto de EVcheck.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function getScoreColorClass(score) {
            if (score >= 80) return 'score-80';
            if (score >= 60) return 'score-60';
            if (score >= 45) return 'score-45';
            return 'score-0';
        }

        function calculateScore(car) {
            let score = 0;
            const w = appWeights;
            
            let batScore = Math.min(((car.tecnica.bateria / 80) * 5) + ((car.tecnica.wltp / 600) * 5), 10);
            score += batScore * (w.bateria / 10);

            let minPrice = car.ofertas.length ? Math.min(...car.ofertas.map(o => o.precioAlContado || 40000)) : 40000;
            let priceScore = Math.max(10 - ((minPrice - 20000) / 2500), 1);
            score += priceScore * (w.precio / 10);

            const pts = car.puntuaciones;
            let disenoScore = ((pts.estetica_ext || 5) + (pts.estetica_int || 5) + (pts.calidad_ext || 5) + (pts.calidad_int || 5)) / 4;
            score += disenoScore * (w.diseno_calidad / 10);
            
            let funcScore = ((pts.funcionalidad_ext || 5) + (pts.funcionalidad_int || 5)) / 2;
            score += funcScore * (w.funcionalidad / 10);
            
            let dinScore = ((pts.dinamica_conduccion || 5) + (pts.aislamiento || 5)) / 2;
            score += dinScore * (w.dinamica / 10);

            let techScore = ((pts.software_info || 5) + (pts.seguridad_adas || 5)) / 2;
            score += techScore * (w.tecnologia / 10);

            const activeEquip = car.equipamiento.filter(e => e.marcado).length;
            const equipRatio = activeEquip / Math.max(car.equipamiento.length, 1);
            score += (equipRatio * 5);

            return Math.min(Math.round(score), 100);
        }

            list.innerHTML = appData.map(car => {

                let currentScore = calculateScore(car);
                
                return `

                    <div class="car-info">
                        <h2>${car.marca} ${car.modelo}</h2>
                        <p>

        function formatGoogleDriveUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/(?:d|open\?id=)([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    // El formato preview es el único que Drive permite embeber libremente en un iframe
                    return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }
            return url;
        }

            const val = input.value.trim();
            if(!val) return;
            
            if (!globalEquipList.some(e => e.nombre.toLowerCase() === val.toLowerCase())) {
                globalEquipList.push({ nombre: val, marcado: false });
                localStorage.setItem('evcheck_global_equip', JSON.stringify(globalEquipList));
            }

            appData.forEach(car => {
                if (!car.equipamiento.some(e => e.nombre.toLowerCase() === val.toLowerCase())) {
                    car.equipamiento.push({ nombre: val, marcado: (car.id === currentCarId) });
                } else if (car.id === currentCarId) {
                    let eq = car.equipamiento.find(e => e.nombre.toLowerCase() === val.toLowerCase());
                    if(eq) eq.marcado = true;
                }
            });

            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            input.value = '';
            renderEquipment(appData.find(c => c.id === currentCarId));
            renderDashboard(); 
        }

        function removeEquip(idx) {
            const car = appData.find(c => c.id === currentCarId);
            car.equipamiento.splice(idx, 1);
            localStorage.setItem('evcheck_data', JSON.stringify(appData));
            renderEquipment(car);
            renderDashboard(); 
        }
    </script>
</body>
</html>
