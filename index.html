<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVcheck v2.5.2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            
            --score-green: #00C800;
            --score-yellow: #FFD60A;
            --score-orange: #FF9F0A;
            --score-red: #FF453A;
            --neon-green: var(--score-green);
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1d1d1f;
            --text-muted: #555;
            --border-color: #e5e5ea;
            
            --score-green: #34C759;
            --score-yellow: #FFCC00;
            --score-orange: #FF9500;
            --score-red: #FF3B30;
            --neon-green: var(--score-green);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        
        header { background-color: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .header-left { display: flex; align-items: center; }
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .car-card { background-color: var(--surface-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
        .car-card-header { display: flex; justify-content: space-between; align-items: center; }
        .car-info h2 { font-size: 1.15rem; margin-bottom: 4px; color: var(--neon-green); }
        .car-info h3 { font-size: 1rem; margin-bottom: 4px; font-weight: normal; }
        .car-info p { font-size: 0.85rem; color: var(--text-muted); }
        
        .car-score { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; border: 1px solid; min-width: 65px; text-align: center; }
        .score-80 { background-color: rgba(52, 199, 89, 0.1); color: var(--score-green); border-color: var(--score-green); }
        .score-60 { background-color: rgba(255, 204, 0, 0.1); color: var(--score-yellow); border-color: var(--score-yellow); }
        .score-45 { background-color: rgba(255, 149, 0, 0.1); color: var(--score-orange); border-color: var(--score-orange); }
        .score-0  { background-color: rgba(255, 59, 48, 0.1); color: var(--score-red); border-color: var(--score-red); }

        .progress-bar-container { width: 100%; background: var(--bg-color); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-fill { height: 100%; transition: width 0.4s ease, background-color 0.4s ease; }
        
        .cat-progress-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cat-progress-text { font-size: 0.9rem; font-weight: bold; min-width: 50px; text-align: right; }

        .config-section { background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .config-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row label { flex: 1; font-size: 0.9rem; }
        .weight-row input, .theme-select { width: 60px; padding: 5px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        .theme-select { width: 150px; font-size: 0.9rem; padding: 8px; }

        #detail-view { padding: 0; }
        .detail-header { position: relative; height: 180px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); overflow: hidden;}
        .detail-header-overlay { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, var(--bg-color)); }
        
        .back-btn { position: absolute; top: 15px; left: 15px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 10; }
        .delete-car-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,59,48,0.1); color: var(--score-red); border: 1px solid var(--score-red); padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .duplicate-car-btn { position: absolute; top: 15px; right: 65px; background: rgba(10,132,255,0.1); color: #0A84FF; border: 1px solid #0A84FF; padding: 8px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        .view-image-btn { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 10px; background: rgba(0, 200, 0, 0.05); border: 1px solid var(--neon-green); border-radius: 12px; z-index: 5; box-shadow: var(--neon-glow); }
        .view-image-btn p { color: var(--neon-green); font-size: 0.8rem; font-weight: bold; margin-top: 8px; }

        .tabs-wrapper { display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); background: var(--surface-color); scroll-behavior: smooth; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab { padding: 14px 15px; font-size: 0.85rem; flex-shrink: 0; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .data-group { margin-bottom: 15px; background: var(--surface-color); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .data-group label { display: block; font-size: 0.85rem; color: var(--neon-green); margin-bottom: 8px; font-weight: bold; }
        .data-group input, .data-group select, .data-group textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 1rem; }
        .data-group input:focus, .data-group select:focus, .data-group textarea:focus { outline: none; border-color: var(--neon-green); }
        .data-group textarea { resize: vertical; min-height: 100px; }
        
        .offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .offer-grid .data-group { padding: 8px; margin: 0; background: var(--surface-color); border: 1px solid var(--border-color); }
        
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .check-item:last-child { border-bottom: none; }
        .check-item label { flex: 1; font-size: 0.95rem; display: flex; align-items: center; cursor: pointer; gap: 12px; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--neon-green); }
        
        .select-item { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--border-color); gap: 8px; }
        .select-item:last-child { border-bottom: none; }
        .select-item label { font-size: 0.95rem; }
        .select-item select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }

        .remove-btn { background: none; border: none; color: var(--score-red); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; margin-left: 10px; }
        
        .add-equip-row { display: flex; gap: 10px; margin-top: 20px; }
        .add-equip-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        
        button.action-btn { background: var(--neon-green); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); margin-bottom: 10px; }
        button.action-btn.small { width: auto; padding: 10px 20px; margin-top: 0; }
        
        .version-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--surface-color); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); margin-left: 10px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { position: relative; width: 100%; height: 85%; max-width: 800px; background: var(--surface-color); border-radius: 12px; overflow: hidden; border: 1px solid var(--neon-green); box-shadow: var(--neon-glow); }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: var(--neon-green); border: 1px solid var(--neon-green); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="margin-right: 10px; border-radius: 8px;">
              <rect width="120" height="120" fill="#ffffff" rx="27" />
              <defs>
                <filter id="neonGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#39FF14" flood-opacity="0.8"/>
                </filter>
              </defs>
              <g filter="url(#neonGlowHeader)" stroke="#00C800" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 84 80 L 36 80 Q 36 92 28 92 Q 20 92 20 80 C 14 65, 16 55, 26 55 L 36 55 C 38 55, 40 30, 44 30 L 56 30 L 46 52 L 58 52 L 54 75 L 72 48 L 60 48 L 68 30 L 76 30 C 80 30, 82 55, 84 55 L 94 55 C 104 55, 106 65, 100 80 Q 100 92 92 92 Q 84 92 84 80 Z" stroke-width="3" />
              </g>
            </svg>
            <h1 id="header-title">EVcheck v2.5.2</h1>
        </div>
        <button class="nav-btn" onclick="toggleSettings()" id="settings-btn" aria-label="Ajustes">
            <!-- Icono restaurado a su formato seguro sin comprimir -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <div id="dashboard-view" class="view active">
        <div id="car-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="action-btn" onclick="addNewCar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Añadir Oferta
            </button>
            <button class="action-btn secondary" style="margin-top: 10px;" onclick="document.getElementById('import-car-file').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Importar JSON (Gem)
            </button>
            <input type="file" id="import-car-file" style="display: none;" accept=".json, .txt" onchange="importSingleCar(event)">
        </div>
    </div>

    <div id="settings-view" class="view">
        <div class="config-section" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; border: none; padding: 0;">Acerca de EVcheck</h3>
            <span class="version-tag" id="app-version-display"></span>
        </div>

        <div class="config-section">
            <h3>Sistema</h3>
            <div class="weight-row" style="border:none; padding:0 0 5px 0;">
                <label for="theme-select">Tema de la aplicación</label>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <option value="auto">Automático (Sistema)</option>
                    <option value="dark">Forzar Noche</option>
                    <option value="light">Forzar Día</option>
                </select>
            </div>
            <button class="action-btn secondary" style="margin-top: 15px;" onclick="checkOTA()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                Buscar Actualizaciones OTA
            </button>
            <p id="ota-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;"></p>
        </div>

        <div class="config-section">
            <h3>Copias de Seguridad (Toda la App)</h3>
            <button class="action-btn secondary" onclick="exportData()">Exportar Datos de la App</button>
            <input type="file" id="import-file" style="display: none;" accept=".json, .txt" onchange="importData(event)">
            <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">Restaurar Datos Completos</button>
        </div>

        <div class="config-section">
            <h3>Pesos de las 10 Categorías (%)</h3>
            <div id="weights-container"></div>
            <div class="weight-row" style="font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <label>Total Actual:</label>
                <span id="weight-total" style="color: var(--neon-green);">100%</span>
            </div>
        </div>

        <div class="config-section">
            <h3>Peligro</h3>
            <button class="action-btn secondary" style="color: var(--score-red); border-color: var(--score-red);" onclick="nukeData()">
                Borrar todos los datos
            </button>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-header" id="detail-header-container">
            <button class="back-btn" onclick="showView('dashboard-view')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Inicio
            </button>
            <button class="duplicate-car-btn" onclick="duplicateCurrentCar()" aria-label="Duplicar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="delete-car-btn" onclick="deleteCurrentCar()" aria-label="Eliminar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            
            <div id="view-image-btn" class="view-image-btn" onclick="openImageModal()" style="display: none;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>Ver Foto</p>
            </div>

            <div class="detail-header-overlay">
                <h1 id="detail-title">Marca Modelo</h1>
            </div>
        </div>

        <div class="tabs-wrapper" id="tabs-container"></div>
        <div id="tabs-content-container"></div>
    </div>

    <!-- Modal de Imagen -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const APP_VERSION = "v2.5.2";
        
        const CATEGORY_DEFS = {
            precio: { title: "Precio", weight: 20 },
            tasacion: { title: "Tasación", weight: 10 },
            bateria: { title: "Batería", weight: 20 },
            conectividad: { title: "Tecnología", weight: 15 },
            adas: { title: "ADAS", weight: 15 },
            extras: { title: "Extras", weight: 3 },
            exterior: { title: "Exterior", weight: 4 },
            interior: { title: "Interior", weight: 8 },
            prueba: { title: "Prueba", weight: 15 },
            garantia: { title: "Garantía", weight: 5 }
        };

        const DEFAULT_WEIGHTS = Object.keys(CATEGORY_DEFS).reduce((acc, key) => {
            acc[key] = CATEGORY_DEFS[key].weight;
            return acc;
        }, {});

        function getNewCarTemplate() {
            return {
                id: "ev-" + Date.now(),
                marca: "Marca",
                modelo: "Modelo",
                concesionario: "Concesionario",
                precioCorto: "0 €",
                img: "",
                notas: "",
                finanzas: { precioContado: 0, precioFinanciado: 0, entrada: 0, plazo: 0, cuotaMensual: 0, cuotaFinal: 0, tae: 0, comision: 0, otros: 0 },
                categorias: {
                    precio: { items: [
                        { id: "p_contado", text: "🏆 Mejor precio al contado (Auto-calculado)", type: "check_auto", val: false }, 
                        { id: "p_intereses", text: "📉 Menores intereses en financiación (Auto-calculado)", type: "check_auto", val: false }, 
                        { id: "p_comision", text: "💸 Menor comisión de apertura (Auto-calculado)", type: "check_auto", val: false }
                    ]},
                    tasacion: { items: [
                        { id: "t1", text: "Tasación Real del Vehículo (€)", type: "number_score", val: 0, minRef: 12000, maxRef: 16000 }
                    ]},
                    bateria: { items: [{ id: "b1", text: "Capacidad de la batería", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+60 kWh", val: 1 }, { label: "+50 kWh", val: 0.5 }, { label: "-50 kWh", val: -0.5 }], val: 0 }, { id: "b2", text: "Autonomía WLTP", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+450 km", val: 1 }, { label: "+400 km", val: 0.5 }, { label: "-400 km", val: -0.5 }], val: 0 }, { id: "b3", text: "Carga rápida (Pico CC)", type: "select", options: [{ label: "Pendiente", val: 0 }, { label: "+100 kW", val: 1 }, { label: "-100 kW", val: -0.5 }], val: 0 }] },

        function deduplicateEquip(equipList) {
            const unique = [];
            const seen = new Set();
            for (let eq of equipList) {
                let lowerName = eq.nombre.trim().toLowerCase();
                if (aliasMap[lowerName]) {
                    eq.nombre = aliasMap[lowerName];
                    lowerName = eq.nombre.toLowerCase();
                }
                if (!seen.has(lowerName)) {
                    seen.add(lowerName);
                    unique.push(eq);
                } else if (eq.marcado) {
                    const existing = unique.find(e => e.nombre.trim().toLowerCase() === lowerName);
                    if (existing) existing.marcado = true;
                }
            }
            return unique;
        }

        function sanitizeJSONString(rawText) {
            let cleanText = rawText.replace(/\[span_\d+\]\((start_span|end_span)\)/g, '');
            cleanText = cleanText.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
            
            const firstBrace = cleanText.indexOf('{');
            const firstBracket = cleanText.indexOf('[');
            let start = -1;
            if (firstBrace !== -1 && firstBracket !== -1) start = Math.min(firstBrace, firstBracket);
            else if (firstBrace !== -1) start = firstBrace;
            else if (firstBracket !== -1) start = firstBracket;
            
            const lastBrace = cleanText.lastIndexOf('}');
            const lastBracket = cleanText.lastIndexOf(']');
            let end = -1;
            if (lastBrace !== -1 && lastBracket !== -1) end = Math.max(lastBrace, lastBracket);
            else if (lastBrace !== -1) end = lastBrace;
            else if (lastBracket !== -1) end = lastBracket;

            if (start !== -1 && end !== -1 && start < end) {
                return cleanText.substring(start, end + 1);
            }
            return cleanText.trim();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let cleanText = sanitizeJSONString(e.target.result);
                    const parsed = JSON.parse(cleanText);
                    
                    if (parsed.data && parsed.version && parsed.version.includes("v2")) {
                        localStorage.setItem('evcheck_v2_data', JSON.stringify(parsed.data));
                        if(parsed.weights) localStorage.setItem('evcheck_v2_weights', JSON.stringify(parsed.weights));
                        alert('Copia restaurada correctamente.');
                        location.reload();
                    } else {
                        alert('El archivo no tiene el formato correcto o es de una versión V1 incompatible.');
                    }
                } catch (err) {
                    alert('Error fatal al leer el archivo. Formato inválido.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function evaluateMarket() {
            let validContados = appData.map(c => Number(c.finanzas?.precioContado || 0)).filter(v => v > 0);
            let minContado = validContados.length > 0 ? Math.min(...validContados) : null;

            let validIntereses = appData.map(c => {
                let f = c.finanzas;
                if(!f) return null;
                let isFinanced = (Number(f.entrada) > 0 || Number(f.plazo) > 0);
                if (!isFinanced) return null;
                let costeTotal = Number(f.entrada || 0) + (Number(f.cuotaMensual || 0) * Number(f.plazo || 0)) + Number(f.cuotaFinal || 0) + Number(f.comision || 0) + Number(f.otros || 0);
                return (costeTotal > 0 && Number(f.precioFinanciado) > 0) ? Math.max(0, costeTotal - Number(f.precioFinanciado)) : null;
            }).filter(v => v !== null);
            let minIntereses = validIntereses.length > 0 ? Math.min(...validIntereses) : null;

            let validComision = appData.map(c => Number(c.finanzas?.comision || 0)).filter(v => v > 0); 
            let minComision = validComision.length > 0 ? Math.min(...validComision) : 0; 

            appData.forEach(car => {
                let f = car.finanzas;
                let items = car.categorias?.precio?.items;
                if(!f || !items) return;
                
                let p1 = items.find(i => i.id === 'p_contado');
                let p2 = items.find(i => i.id === 'p_intereses');
                let p3 = items.find(i => i.id === 'p_comision');

                if(p1) p1.val = (Number(f.precioContado) > 0 && Number(f.precioContado) === minContado);
                
                let isFinanced = (Number(f.entrada) > 0 || Number(f.plazo) > 0);
                let costeTotal = isFinanced ? (Number(f.entrada || 0) + (Number(f.cuotaMensual || 0) * Number(f.plazo || 0)) + Number(f.cuotaFinal || 0) + Number(f.comision || 0) + Number(f.otros || 0)) : 0;
                let int = (isFinanced && costeTotal > 0 && Number(f.precioFinanciado) > 0) ? Math.max(0, costeTotal - Number(f.precioFinanciado)) : null;
                if(p2) p2.val = (int !== null && int === minIntereses);

                if(p3) p3.val = (Number(f.plazo) > 0 && Number(f.comision) <= minComision); 
            });

            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
        }

        function calculateScore(car) {
            let totalContribution = 0;
            
            for (let catId in CATEGORY_DEFS) {
                if (!car.categorias || !car.categorias[catId]) continue;
                let cat = car.categorias[catId];
                let weight = Number(appWeights[catId] !== undefined ? appWeights[catId] : CATEGORY_DEFS[catId].weight);
                let numItems = cat.items.length;
                
                if (numItems === 0) continue;

                let catRawScore = cat.items.reduce((acc, item) => {
                    let v = 0;
                    if (item.type === 'check' || item.type === 'check_auto') v = item.val ? 1 : 0;
                    else if (item.type === 'select') v = Number(item.val || 0);
                    else if (item.type === 'number_score') v = Math.max(0, Math.min(1, (Number(item.val || 0) - item.minRef) / (item.maxRef - item.minRef)));
                    return acc + v;
                }, 0);

                let catPercent = (catRawScore / numItems);
                totalContribution += (catPercent * weight);
            }

            return Math.min(100, Math.max(0, Math.round(totalContribution)));
        }

            if (url.includes('drive.google.com')) {

                if (match && match[1]) {
                    return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }
            return url;
        }

            for (let catId in CATEGORY_DEFS) {
                if (!car.categorias || !car.categorias[catId]) continue; 
                
                tabsHtml += `<div class="tab" id="tab-btn-${catId}" onclick="switchTab('tab-btn-${catId}', 'tab-content-${catId}')">${CATEGORY_DEFS[catId].title}</div>`;
                
                let cat = car.categorias[catId];
                let maxVal = cat.items.length;
                let currentVal = cat.items.reduce((acc, item) => {
                    let v = 0;
                    if (item.type === 'check' || item.type === 'check_auto') v = item.val ? 1 : 0;
                    else if (item.type === 'select') v = Number(item.val || 0);
                    else if (item.type === 'number_score') v = Math.max(0, Math.min(1, (Number(item.val || 0) - item.minRef) / (item.maxRef - item.minRef)));
                    return acc + v;
                }, 0);
                
                let percentage = maxVal > 0 ? (currentVal / maxVal) * 100 : 0;
                let visPercent = Math.max(0, Math.min(100, percentage));
                let color = visPercent >= 80 ? 'var(--score-green)' : visPercent >= 50 ? 'var(--score-yellow)' : 'var(--score-red)';

                let finanzasHtml = '';
                if (catId === 'precio') {
                    const f = car.finanzas;
                    const isFinanced = (Number(f.entrada) > 0 || Number(f.plazo) > 0);
                    const costeTotal = isFinanced ? (Number(f.entrada || 0) + (Number(f.cuotaMensual || 0) * Number(f.plazo || 0)) + Number(f.cuotaFinal || 0) + Number(f.comision || 0) + Number(f.otros || 0)) : Number(f.precioContado || 0);
                    const intereses = isFinanced ? Math.max(0, costeTotal - Number(f.precioFinanciado || 0)) : 0;

                    finanzasHtml = `
                        <div style="margin-bottom: 25px; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px;">
                            <h4 style="color: var(--neon-green); margin-bottom: 15px;">Datos de Financiación (Cálculos Mágicos)</h4>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                                <div class="data-group" style="margin:0; padding:8px;"><label>Al Contado (€)</label><input type="number" value="${f.precioContado}" oninput="updateFinanzas('precioContado', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Financiado (Base) (€)</label><input type="number" value="${f.precioFinanciado}" oninput="updateFinanzas('precioFinanciado', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Entrada (€)</label><input type="number" value="${f.entrada}" oninput="updateFinanzas('entrada', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Plazo (Meses)</label><input type="number" value="${f.plazo}" oninput="updateFinanzas('plazo', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Cuota Mensual (€)</label><input type="number" value="${f.cuotaMensual}" oninput="updateFinanzas('cuotaMensual', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Cuota Final (€)</label><input type="number" value="${f.cuotaFinal}" oninput="updateFinanzas('cuotaFinal', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Comisión Apertura (€)</label><input type="number" value="${f.comision}" oninput="updateFinanzas('comision', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px;"><label>Otros Gastos (€)</label><input type="number" value="${f.otros || 0}" oninput="updateFinanzas('otros', this.value)"></div>
                                <div class="data-group" style="margin:0; padding:8px; grid-column: 1 / -1;"><label>TAE (%)</label><input type="number" step="0.1" value="${f.tae}" oninput="updateFinanzas('tae', this.value)"></div>
                            </div>
                            <div style="background: rgba(0, 200, 0, 0.05); border: 1px solid var(--neon-green); border-radius: 8px; padding: 15px; font-size: 0.95rem;">
                                <p style="margin-bottom: 8px; display: flex; justify-content: space-between;">
                                    <strong>Coste Total a Plazos:</strong> 
                                    <span id="finance-coste-total" style="color:var(--text-color); font-weight: bold; font-size: 1.1rem;">${costeTotal > 0 ? costeTotal.toLocaleString('es-ES') + ' €' : '0 €'}</span>
                                </p>
                                <p style="margin-bottom: 0; display: flex; justify-content: space-between;">
                                    <span>Intereses al banco:</span> 
                                    <span id="finance-intereses" style="color:var(--score-red);">${intereses > 0 ? '+' + intereses.toLocaleString('es-ES') + ' €' : '0 €'}</span>
                                </p>
                            </div>
                        </div>
                    `;
                }

                contentHtml += `
                <div id="tab-content-${catId}" class="tab-content">
                    <div class="cat-progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-fill" id="progress-fill-${catId}" style="width: ${visPercent}%; background-color: ${color};"></div>
                        </div>
                        <div class="cat-progress-text" id="progress-text-${catId}" style="color: ${color}">${Math.round(percentage)}%</div>
                    </div>
                    
                    ${finanzasHtml}

                    <div id="items-list-${catId}">
                        ${cat.items.map((item, idx) => {
                            if (item.type === 'check') {
                                return `
                                <div class="check-item">
                                    <label>
                                        <input type="checkbox" ${item.val ? 'checked' : ''} onchange="updateItemVal('${catId}',${idx}, this.checked, 'check')">
                                        ${item.text}
                                    </label>
                                    <button class="remove-btn" onclick="removeItem('${catId}',${idx})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                                </div>`;
                            } else if (item.type === 'check_auto') {
                                return `
                                <div class="check-item" style="background: rgba(0, 200, 0, 0.05); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px dashed var(--neon-green);">
                                    <label id="label-auto-${item.id}" style="color: var(--neon-green); opacity: ${item.val ? '1' : '0.4'}; transition: opacity 0.3s;">
                                        <input type="checkbox" id="check-auto-${item.id}" ${item.val ? 'checked' : ''} disabled>
                                        ${item.text}
                                    </label>
                                </div>`;
                            } else if (item.type === 'select') {
                                return `
                                <div class="select-item">
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <label style="color:var(--neon-green); font-weight:bold;">${item.text}</label>
                                        <button class="remove-btn" onclick="removeItem('${catId}',${idx})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                                    </div>
                                    <select onchange="updateItemVal('${catId}',${idx}, this.value, 'select')">
                                        ${item.options.map(opt => `<option value="${opt.val}" ${Number(item.val) === Number(opt.val) ? 'selected' : ''}>${opt.label}</option>`).join('')}
                                    </select>
                                </div>`;
                            } else if (item.type === 'number_score') {
                                return `
                                <div class="data-group" style="margin-bottom: 10px; border-color: var(--neon-green);">
                                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                                        <label style="color:var(--neon-green); font-weight:bold; margin:0;">${item.text}</label>
                                    </div>
                                    <div style="display:flex; gap: 10px; align-items:center;">
                                        <input type="number" value="${item.val}" oninput="updateItemVal('${catId}',${idx}, this.value, 'number_score')">
                                        <span style="font-size:0.75rem; color:var(--text-muted); min-width: 90px; text-align:right;">Rango Máximo<br>${item.minRef.toLocaleString('es-ES')} -${item.maxRef.toLocaleString('es-ES')}</span>
                                    </div>
                                </div>`;
                            }
                        }).join('')}
                    </div>
                    <div class="add-equip-row">
                        <input type="text" id="new-item-input-${catId}" placeholder="Añadir nuevo elemento a ${CATEGORY_DEFS[catId].title}">
                        <button class="action-btn small" onclick="addNewItem('${catId}')">Añadir</button>
                    </div>
                </div>`;
            }

            tabsWrapper.innerHTML = tabsHtml;
            contentContainer.innerHTML = contentHtml;
        }

        function switchTab(btnId, contentId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const btn = document.getElementById(btnId);
            const content = document.getElementById(contentId);
            
            if(btn) btn.classList.add('active');
            if(content) content.classList.add('active');
        }

        function updateCarBaseData(key, val) {
            const car = appData.find(c => c.id === currentCarId);
            if (!car) return;
            car[key] = val;
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            
            if (key === 'marca' || key === 'modelo') {
                document.getElementById('detail-title').innerText = `${car.marca} ${car.modelo}`;
                renderDashboard();
            }
            if (key === 'concesionario' || key === 'precioCorto') {
                renderDashboard();
            }
            if (key === 'img') {
                updateHeaderImageBtn(val);
            }
        }

        function updateCategoryProgressDOM(car, catId) {
            let cat = car.categorias[catId];
            if(!cat) return;
            let maxVal = cat.items.length;
            let currentVal = cat.items.reduce((acc, item) => {
                let v = 0;
                if (item.type === 'check' || item.type === 'check_auto') v = item.val ? 1 : 0;
                else if (item.type === 'select') v = Number(item.val || 0);
                else if (item.type === 'number_score') v = Math.max(0, Math.min(1, (Number(item.val || 0) - item.minRef) / (item.maxRef - item.minRef)));
                return acc + v;
            }, 0);
            let percentage = maxVal > 0 ? (currentVal / maxVal) * 100 : 0;
            let visPercent = Math.max(0, Math.min(100, percentage));
            let color = visPercent >= 80 ? 'var(--score-green)' : visPercent >= 50 ? 'var(--score-yellow)' : 'var(--score-red)';
            
            let fillEl = document.getElementById(`progress-fill-${catId}`);
            let textEl = document.getElementById(`progress-text-${catId}`);
            if (fillEl) { fillEl.style.width = visPercent + '%'; fillEl.style.backgroundColor = color; }
            if (textEl) { textEl.innerText = Math.round(percentage) + '%'; textEl.style.color = color; }
        }

        function updateFinanzas(key, val) {
            const car = appData.find(c => c.id === currentCarId);
            if (!car) return;
            car.finanzas[key] = val === '' ? 0 : Number(val);
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            
            const f = car.finanzas;
            const isFinanced = (Number(f.entrada) > 0 || Number(f.plazo) > 0);
            const costeTotal = isFinanced ? (Number(f.entrada || 0) + (Number(f.cuotaMensual || 0) * Number(f.plazo || 0)) + Number(f.cuotaFinal || 0) + Number(f.comision || 0) + Number(f.otros || 0)) : Number(f.precioContado || 0);
            const intereses = isFinanced ? Math.max(0, costeTotal - Number(f.precioFinanciado || 0)) : 0;

            const elCoste = document.getElementById('finance-coste-total');
            const elIntereses = document.getElementById('finance-intereses');
            if (elCoste) elCoste.innerText = costeTotal > 0 ? costeTotal.toLocaleString('es-ES') + ' €' : '0 €';
            if (elIntereses) elIntereses.innerText = intereses > 0 ? '+' + intereses.toLocaleString('es-ES') + ' €' : '0 €';

            evaluateMarket(); 
            
            const p1 = car.categorias.precio.items.find(i => i.id === 'p_contado');
            const p2 = car.categorias.precio.items.find(i => i.id === 'p_intereses');
            const p3 = car.categorias.precio.items.find(i => i.id === 'p_comision');
            const cb1 = document.getElementById('check-auto-p_contado');
            const cb2 = document.getElementById('check-auto-p_intereses');
            const cb3 = document.getElementById('check-auto-p_comision');
            
            if (cb1 && p1) { cb1.checked = p1.val; document.getElementById('label-auto-p_contado').style.opacity = p1.val ? '1' : '0.4'; }
            if (cb2 && p2) { cb2.checked = p2.val; document.getElementById('label-auto-p_intereses').style.opacity = p2.val ? '1' : '0.4'; }
            if (cb3 && p3) { cb3.checked = p3.val; document.getElementById('label-auto-p_comision').style.opacity = p3.val ? '1' : '0.4'; }

            updateCategoryProgressDOM(car, 'precio');
            renderDashboard(); 
        }

        function updateItemVal(catId, itemIdx, val, type) {
            const car = appData.find(c => c.id === currentCarId);
            if (!car) return;
            if (type === 'check') car.categorias[catId].items[itemIdx].val = val;
            else if (type === 'select' || type === 'number_score') car.categorias[catId].items[itemIdx].val = Number(val);
            
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            updateCategoryProgressDOM(car, catId);
            renderDashboard();
        }

        function addNewItem(catId) {
            const input = document.getElementById(`new-item-input-${catId}`);
            const val = input.value.trim();
            if (!val) return;

            const car = appData.find(c => c.id === currentCarId);
            if (!car) return;
            car.categorias[catId].items.push({ id: Date.now(), text: val, type: "check", val: true });
            
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            buildDynamicTabsAndContent(car);
            switchTab(`tab-btn-${catId}`, `tab-content-${catId}`);
        }

        function removeItem(catId, itemIdx) {
            const car = appData.find(c => c.id === currentCarId);
            if (!car) return;
            car.categorias[catId].items.splice(itemIdx, 1);
            
            localStorage.setItem('evcheck_v2_data', JSON.stringify(appData));
            buildDynamicTabsAndContent(car);
            switchTab(`tab-btn-${catId}`, `tab-content-${catId}`);
        }
    </script>
</body>
</html>
